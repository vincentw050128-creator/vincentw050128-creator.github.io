<!doctype html>
<html lang="zh-CN">
<head>

  <title>我的新叶 · Apple 精修版</title>
  <style>
    :root{--accent:#a22e25;--green:#225f48;--ink:#1c1b19;--muted:#68645e;--paper:#fbfaf7;--line:#e9e5de;--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;--serif:"Songti SC","STSong","SimSun",serif}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:var(--sans);color:var(--ink)}button{font:inherit}
    body{display:grid;place-items:center;padding:32px;background:radial-gradient(ellipse at 50% 22%,#fff 0,#f5f2ee 68%,#ede8e1 100%)}
    .stage{display:flex;flex-direction:column;align-items:center;gap:16px}.caption{font-size:12px;letter-spacing:.08em;color:#777}.caption strong{color:#333}
    .device{position:relative;width:390px;height:844px;padding:12px;border-radius:56px;background:linear-gradient(160deg,#29292b,#111 56%,#050505);box-shadow:inset 0 0 0 2px #000,0 28px 60px -12px #0007,0 8px 20px -8px #0006}
    .device:before,.device:after{content:"";position:absolute;top:100px;bottom:100px;width:3px;background:linear-gradient(transparent,#ffffff18 12%,transparent 22%,transparent 78%,#ffffff12 90%,transparent)}.device:before{left:-1px}.device:after{right:-1px}
    .rail{position:absolute;width:4px;border-radius:3px;background:#09090b}.r1{left:-3px;top:174px;height:32px}.r2{left:-3px;top:220px;height:60px}.r3{left:-3px;top:290px;height:60px}.r4{right:-3px;top:250px;height:100px}
    .island{position:absolute;z-index:50;top:22px;left:50%;translate:-50%;width:124px;height:36px;border-radius:99px;background:#000}
    .screen{position:relative;width:100%;height:100%;overflow:hidden;border-radius:44px;background:#fff}
    .status{position:absolute;z-index:40;top:0;left:0;right:0;height:48px;padding:18px 26px 0;display:flex;justify-content:space-between;align-items:flex-start;font-weight:650;font-size:15px}.status-right{display:flex;align-items:center;gap:6px}.status svg{width:17px;height:11px;fill:#111}.status .battery{width:25px}
    .content{position:absolute;inset:48px 0 77px;overflow-y:auto;scrollbar-width:none;background:#fff;padding:11px 24px 20px}.content::-webkit-scrollbar{display:none}
    .mini{position:absolute;right:20px;top:4px;width:72px;height:28px;border:0;border-radius:18px;background:#fff;box-shadow:0 4px 16px #00000012;display:flex;align-items:center;justify-content:space-evenly;font-size:16px}.mini:after{content:"";width:13px;height:13px;border:1.5px solid #111;border-radius:50%;box-shadow:inset 0 0 0 3.5px #fff,inset 0 0 0 5px #111}.mini span{letter-spacing:2px;border-right:1px solid #eee;padding-right:10px;line-height:11px}
    .hero{position:relative;height:148px;padding-top:22px}.sprig{position:absolute;left:-24px;top:-8px;width:55px;height:78px;opacity:.18;background:linear-gradient(145deg,transparent 43%,#39845c 44% 46%,transparent 47%)}.sprig:before,.sprig:after{content:"";position:absolute;width:14px;height:27px;border-radius:100% 0;background:#4d996a;rotate:-42deg}.sprig:before{left:16px;top:24px}.sprig:after{left:27px;top:40px;scale:.8}
    h1{position:relative;z-index:2;margin:0 0 6px;font:500 29px/1.15 var(--serif);letter-spacing:.04em}.subtitle{position:relative;z-index:2;width:190px;font:12px/1.5 var(--serif);color:#303230;white-space:nowrap}.watercolor{position:absolute;right:-24px;top:31px;width:202px;height:116px;background:url('../assets/images/mine/P07_我的新叶_顶部村景.png') center/cover no-repeat;opacity:.95;mask-image:linear-gradient(90deg,transparent 0,#000 16%,#000 88%,transparent 100%)}
    .stats{position:absolute;z-index:3;left:0;width:168px;bottom:0;display:grid;grid-template-columns:repeat(4,1fr)}.stat{text-align:center;border-right:1px solid #e5e5e5}.stat:last-child{border:0}.stat i{display:block;height:15px;color:var(--green);font-style:normal;font-size:13px}.stat b{display:block;font:500 20px/1.1 var(--serif)}.stat small{font-size:8px;color:#4f5350;white-space:nowrap}.stat:last-child b:after{content:" km";font:7px var(--sans);color:#555}
    .section{margin-top:13px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.section h2{margin:0;font:500 16px/1.2 var(--serif)}.more{border:0;background:none;color:var(--green);font-size:10px;cursor:pointer}.more:after{content:"›";font-size:17px;margin-left:6px;vertical-align:-1px}
    .journey{border:1px solid #edf0ed;border-radius:12px;box-shadow:0 5px 14px #0000000b;padding:13px 13px 8px}.route{position:relative;display:grid;grid-template-columns:repeat(3,1fr);text-align:center}.route:before{content:"";position:absolute;left:14%;right:14%;top:6px;border-top:1.5px dashed #5e917a}.stop{position:relative}.dot{position:relative;z-index:1;margin:auto;width:14px;height:14px;border-radius:50%;background:var(--green);color:white;font:9px/14px var(--sans)}.place{font:12px var(--serif);margin-top:6px}.time{font-size:9px;color:#858585;margin:2px 0 7px}.photo{height:52px;margin:0 5px;border-radius:8px;background-size:cover;background-position:center;background-repeat:no-repeat}.p1{background-image:url('../assets/images/mine/P07_南塘.png')}.p2{background-image:url('../assets/images/mine/P07_西山祠堂.png')}.p3{background-image:url('../assets/images/mine/P07_抟云塔.png')}
    .tripmeta{display:grid;grid-template-columns:repeat(3,1fr);margin-top:7px;border-top:1px solid #f0f0f0;padding-top:7px;text-align:center;font-size:9px;color:#595d5a}.tripmeta span+span{border-left:1px solid #ddd}
    .imprint{display:grid;grid-template-columns:95px 1fr;gap:13px;padding:6px;border:1px solid #edf0ed;border-radius:11px;box-shadow:0 5px 14px #0000000b}.imprint-img{height:72px;border-radius:7px;background:url('../assets/images/mine/P07_文化印记.png') center/cover no-repeat}.imprint small{color:#888;font-size:8px}.imprint h3{font:500 14px var(--serif);margin:3px 0}.imprint p{font-size:9px;color:#777;margin:0;white-space:nowrap}.chips{margin-top:6px;display:flex;gap:5px}.chips span{background:#f5f5f4;border-radius:8px;padding:2px 7px;font-size:8px;color:#666}.date{float:right;margin-top:-13px;font-size:8px;color:#888}
    .timeline{position:relative;padding:1px 0 0 30px}.timeline:before{content:"";position:absolute;left:10px;top:5px;bottom:3px;border-left:1px dashed #b9c9c0}.event{position:relative;min-height:38px}.event:before{content:"";position:absolute;left:-24px;top:3px;width:8px;height:8px;border:3px solid var(--green);background:#fff;border-radius:50%}.event b{display:block;font:500 13px var(--serif)}.event span{font-size:9px;color:#777}.thumb{position:absolute;right:0;top:-2px;width:55px;height:30px;border-radius:6px;background-size:cover;background-position:center;background-repeat:no-repeat}.t1{background-image:url('../assets/images/mine/P07_足迹_南塘.jpg')}.t2{background-image:url('../assets/images/mine/P07_足迹_西山祠堂.jpg')}.t3{background-image:url('../assets/images/mine/P07_足迹_抟云塔.jpg');background-position:center 38%}
    .tabbar{position:absolute;z-index:35;left:0;right:0;bottom:20px;height:57px;display:grid;grid-template-columns:repeat(5,1fr);border-top:.5px solid var(--line);background:#fffffffa;padding-top:5px}.tab{border:0;background:none;color:#4f4b46;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;cursor:pointer}.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.5}.tab.active{color:var(--accent)}.tab.active svg{stroke-width:1.9}.home{position:absolute;z-index:36;bottom:7px;left:50%;translate:-50%;width:134px;height:5px;border-radius:9px;background:#151515}.toast{position:absolute;z-index:80;left:50%;bottom:96px;translate:-50% 10px;padding:7px 12px;border-radius:16px;background:#161616dc;color:#fff;font-size:11px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;translate:-50% 0}
    @media(max-width:480px){body{padding:0;background:#111}.stage{gap:0}.caption{display:none}.device{width:100vw;height:100dvh;border-radius:0;padding:0}.screen{border-radius:0}.island{top:10px}.rail{display:none}}
  </style>
