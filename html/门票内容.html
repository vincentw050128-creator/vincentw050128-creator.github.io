<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>P06 门票</title>
  <style>:root {
  --bg: oklch(98% 0.004 95);
  --paper: oklch(99.5% 0.002 90);
  --surface: oklch(100% 0 0);
  --ink: oklch(20% 0.018 70);
  --muted: oklch(48% 0.012 70);
  --line: oklch(90% 0.006 95);
  --accent: oklch(52% 0.10 28);
  --accent-soft: oklch(95% 0.012 30);
  --shadow: 0 0 0 0.5px rgba(255,255,255,0.6) inset, 0 8px 28px rgba(0,0,0,0.10), 0 3px 10px rgba(0,0,0,0.06);
  --shadow-lift: 0 0 0 0.5px rgba(255,255,255,0.7) inset, 0 16px 40px rgba(0,0,0,0.12), 0 6px 16px rgba(0,0,0,0.08);
  --serif: 'Songti SC','STSong','SimSun',Georgia,serif;
  --sans: -apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;
  --device-status-height: 47px;
  --navigation-top-gap: 10px;
  --navigation-height: 48px;
  --checkout-safe-space: calc(var(--checkout-height, 92px) + env(safe-area-inset-bottom) + 48px);
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); height: 100%; }
body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.4 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input { font: inherit; }

/* Select page wrapper */
.select-wrapper {
  width: 100%;
  height: 100%;
  max-width: 430px;
  margin: auto;
  position: relative;
  display: flex;
  flex-direction: column;
  background: radial-gradient(60% 80% at 50% 0%, oklch(98% 0.006 85) 0%, var(--bg) 60%);
}

/* Fixed topbar for select page */
.topbar-fixed {
  position: fixed;
  top: calc(env(safe-area-inset-top) + var(--device-status-height) + var(--navigation-top-gap));
  left: 50%;
  transform: translateX(-50%);
  width: min(100%, 430px);
  height: var(--navigation-height);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  z-index: 100;
  background: transparent;
  transition: all 0.2s ease;
}
.topbar-fixed.scrolled {
  background: linear-gradient(to bottom, rgba(255,253,249,0.36), rgba(255,253,249,0));
}
.topbar-fixed h1 {
  font-size: 16px;
  margin: 0;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.back {
  border: 0;
  background: transparent;
  min-width: 44px;
  min-height: 44px;
  display: grid;
  place-items: center;
  color: var(--ink);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  font-size: 26px;
  font-weight: 300;
  transition: opacity 0.15s ease;
  margin-left: -12px;
}
.back:active { opacity: 0.5; }

/* WeChat capsule */
.wx-capsule {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 0.5px solid oklch(88% 0.006 95);
  border-radius: 16px;
  min-width: 68px;
  min-height: 30px;
  padding: 0 10px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.wx-capsule svg {
  width: 20px;
  height: 20px;
  color: var(--ink);
  opacity: 0.7;
}
.wx-divider {
  width: 1px;
  height: 18px;
  background: oklch(85% 0.008 95);
}

/* Select main scrollable */
.select-main {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: calc(env(safe-area-inset-top) + var(--device-status-height) + var(--navigation-top-gap) + var(--navigation-height) - 2px) 20px 32px;
}
.select-main::-webkit-scrollbar {
  width: 3px;
}
.select-main::-webkit-scrollbar-track {
  background: transparent;
}
.select-main::-webkit-scrollbar-thumb {
  background: rgba(176, 156, 133, 0.2);
  border-radius: 999px;
}

/* Intro */
.intro h2 {
  font: 500 28px/1.25 var(--serif);
  margin: 0 0 8px;
  letter-spacing: 0.02em;
}
.intro { text-align: center; }
.intro p {
  color: var(--muted);
  margin: 0 0 24px;
  font-size: 14px;
  line-height: 1.4;
}

/* Cards */
.pass-card, .ticket-card, .info-card, .notice {
  background: var(--paper);
  border: 0.5px solid rgba(176, 156, 133, 0.12);
  border-radius: 26px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.pass-card {
  display: block;
  color: inherit;
  text-decoration: none;
  margin-bottom: 28px;
  cursor: pointer;
  transition: all 0.18s ease;
  -webkit-tap-highlight-color: transparent;
}
.pass-card:active {
  transform: scale(0.98);
  box-shadow: var(--shadow-lift);
}
.card-image {
  width: 100%;
  height: 220px;
  object-fit: cover;
  display: block;
  position: relative;
}
.pass-copy {
  padding: 20px 22px 22px;
  position: relative;
}
.pass-copy::before {
  content: '';
  position: absolute;
  top: -32px;
  left: 0;
  right: 0;
  height: 32px;
  background: linear-gradient(to bottom, transparent 0%, var(--paper) 100%);
  pointer-events: none;
}
.card-top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: flex-start;
}
.card-top h3 {
  font: 500 24px/1.2 var(--serif);
  margin: 0;
  letter-spacing: 0.01em;
}
.badge {
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 18px;
  padding: 4px 10px;
  font-size: 11px;
  white-space: nowrap;
  font-weight: 500;
}
.desc {
  color: var(--muted);
  margin: 9px 0 18px;
  font-size: 14px;
  line-height: 1.4;
}
.price-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}
.price {
  font: 600 27px var(--serif);
  color: var(--accent);
  letter-spacing: -0.01em;
}
.price small {
  font: 14px var(--sans);
  font-weight: 500;
}
.saving {
  font-size: 12px;
  color: var(--accent);
  font-weight: 500;
  opacity: 0.85;
}
.included {
  border-top: 0.5px solid var(--line);
  margin-top: 18px;
  padding-top: 16px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
}

/* Section */
.section-heading {
  margin: 0 0 14px;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.section-heading small {
  font-size: 12px;
  color: var(--muted);
  font-weight: 400;
  margin-left: 8px;
}
.single-ticket-heading { text-align: center; margin-bottom: 18px; }
.single-ticket-heading small { display: block; margin: 6px 0 0; }

/* Ticket list */
.ticket-list {
  display: grid;
  gap: 16px;
}
.village-list { margin-bottom: 18px; }
.ticket-card {
  display: grid;
  grid-template-columns: 140px 1fr;
  min-height: 158px;
  text-decoration: none;
  color: inherit;
  cursor: pointer;
  transition: all 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.ticket-card:active {
  transform: scale(0.98);
  box-shadow: var(--shadow-lift);
}
.ticket-card img {
  width: 140px;
  height: 100%;
  min-height: 158px;
  object-fit: cover;
  border-radius: 26px 0 0 26px;
}
.ticket-copy {
  padding: 18px 16px;
  display: flex;
  flex-direction: column;
}
.ticket-copy h3 {
  font: 500 20px/1.25 var(--serif);
  margin: 0 0 6px;
  letter-spacing: 0.01em;
}
.ticket-copy p {
  font-size: 13px;
  color: var(--muted);
  margin: 0 0 auto;
  line-height: 1.4;
}
.ticket-copy .price-row {
  margin-top: 16px;
}
.ticket-copy .price {
  font-size: 21px;
}
.arrow {
  color: var(--accent);
  font-size: 13px;
  opacity: 0.8;
}

/* Detail page wrapper */
.detail-wrapper {
  width: 100%;
  height: 100%;
  max-width: 430px;
  margin: auto;
  position: relative;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

/* Fixed hero topbar for detail page */
.hero-topbar-fixed {
  position: fixed;
  top: calc(env(safe-area-inset-top) + var(--device-status-height) + var(--navigation-top-gap));
  left: 50%;
  transform: translateX(-50%);
  width: min(100%, 430px);
  height: var(--navigation-height);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  z-index: 100;
  transition: all 0.2s ease;
}
.hero-topbar-fixed.on-white .hero-back,
.hero-topbar-fixed.on-white .wx-capsule.hero-capsule {
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.hero-topbar-fixed.on-white .hero-back svg,
.hero-topbar-fixed.on-white .wx-capsule.hero-capsule svg {
  color: var(--ink);
}
.hero-topbar-fixed.on-white .wx-capsule.hero-capsule .wx-divider {
  background: oklch(85% 0.008 95);
}
.hero-back {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 0;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, 0.14);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 0.5px solid rgba(255, 255, 255, 0.24);
  color: #fff;
  cursor: pointer;
  transition: all 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.hero-back:active {
  background: rgba(255, 255, 255, 0.20);
}
.hero-back svg {
  color: #fff;
}
.wx-capsule.hero-capsule {
  background: rgba(255, 255, 255, 0.14);
  border: 0.5px solid rgba(255, 255, 255, 0.24);
}
.wx-capsule.hero-capsule svg {
  color: #fff;
  opacity: 0.9;
}
.wx-capsule.hero-capsule .wx-divider {
  background: rgba(255, 255, 255, 0.3);
}

/* Detail main scrollable */
.detail-main {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}
.detail-main { padding-bottom: var(--checkout-safe-space); }
.detail-main::-webkit-scrollbar {
  width: 3px;
}
.detail-main::-webkit-scrollbar-track {
  background: transparent;
}
.detail-main::-webkit-scrollbar-thumb {
  background: rgba(176, 156, 133, 0.2);
  border-radius: 999px;
}

/* Hero - full bleed to top */
.hero {
  position: relative;
  height: 420px;
  overflow: hidden;
  isolation: isolate;
  margin-bottom: -40px;
}
.hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.hero::after {
  content: '';
  position: absolute;
  inset: 45% 0 0;
  background: linear-gradient(
    to bottom,
    transparent 0%,
    rgba(0,0,0,0.14) 30%,
    rgba(0,0,0,0.44) 100%
  );
  z-index: 1;
}
.hero-title {
  position: absolute;
  z-index: 2;
  bottom: 48px;
  left: 20px;
  right: 20px;
  color: #fff;
}
.hero-title h1 {
  font: 500 32px/1.15 var(--serif);
  margin: 0 0 6px;
  letter-spacing: 0.02em;
  text-shadow: 0 1px 3px rgba(0,0,0,0.15);
}
.hero-title p {
  margin: 0;
  color: rgba(255, 255, 255, 0.92);
  font-size: 14px;
  line-height: 1.4;
  text-shadow: 0 1px 2px rgba(0,0,0,0.12);
}

/* Info card - lift effect */
.info-card {
  padding: 22px;
  margin: 0 20px 18px;
}
.lift-card {
  position: relative;
  z-index: 2;
  margin-top: 0;
  border-radius: 32px;
}
.detail-price {
  font: 600 30px var(--serif);
  color: var(--accent);
  letter-spacing: -0.01em;
}
.detail-label {
  font-size: 12px;
  color: var(--muted);
  margin: 18px 0 8px;
  font-weight: 500;
}
.detail-text {
  font-size: 14px;
  line-height: 1.5;
  margin: 0;
  color: var(--ink);
}
.chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.chip {
  background: oklch(96% 0.004 90);
  border: 0.5px solid var(--line);
  border-radius: 20px;
  padding: 6px 11px;
  font-size: 13px;
  line-height: 1.3;
}

/* Date options */
.date-options {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.date-option {
  border: 0.5px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
  padding: 12px 4px;
  text-align: center;
  cursor: pointer;
  min-height: 56px;
  transition: all 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.date-option:active {
  transform: scale(0.96);
}
.date-option.active {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
  box-shadow: 0 0 0 0.5px var(--accent) inset;
}
.date-option strong {
  display: block;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 2px;
}
.date-option span {
  display: block;
  font-size: 11px;
  color: var(--muted);
}
.date-option.active span {
  color: var(--accent);
  opacity: 0.8;
}
.more-date {
  margin-top: 12px;
  width: 100%;
  border: 0.5px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  background: var(--surface);
  cursor: pointer;
  font-size: 14px;
  transition: all 0.15s ease;
}
.more-date:focus, .more-date.date-selected {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 0.5px var(--accent) inset;
  background: var(--accent-soft);
}
.open-time {
  margin-top: 20px;
}

/* Quantity */
.quantity-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}
.quantity {
  display: flex;
  align-items: center;
  gap: 16px;
}
.quantity button {
  width: 44px;
  height: 44px;
  border: 0.5px solid var(--line);
  background: var(--surface);
  border-radius: 50%;
  font-size: 22px;
  cursor: pointer;
  transition: all 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.quantity button:active {
  transform: scale(0.94);
  background: oklch(96% 0.004 90);
}
.quantity output {
  min-width: 32px;
  text-align: center;
  font-size: 18px;
  font-weight: 600;
}
.quantity-note {
  font-size: 12px;
  color: var(--muted);
}

/* Form field */
.field {
  margin-top: 16px;
}
.field label {
  display: block;
  font-size: 13px;
  margin-bottom: 8px;
  font-weight: 500;
}
.field input {
  width: 100%;
  border: 0.5px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  background: var(--surface);
  outline: none;
  font-size: 15px;
  transition: all 0.15s ease;
}
.field input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 0.5px var(--accent) inset;
}
.error {
  color: var(--accent);
  font-size: 12px;
  min-height: 18px;
  margin-top: 5px;
  font-weight: 500;
}

/* Notice */
.notice { margin: 20px 20px 0; }
.notice summary {
  padding: 18px 20px;
  cursor: pointer;
  font-weight: 600;
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.notice summary::after {
  content: '›';
  font-size: 18px;
  color: var(--muted);
  transform: rotate(90deg);
  transition: transform 0.2s ease;
}
.notice[open] summary::after {
  transform: rotate(270deg);
}
.notice p {
  padding: 0 20px 20px;
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
}

/* Checkout */
.checkout {
  position: fixed;
  z-index: 50;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: min(100%, 430px);
  padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
  background: rgba(255, 253, 249, 0.96);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-top: 0.5px solid rgba(255, 255, 255, 0.6);
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 -4px 16px rgba(0,0,0,0.06), 0 -1px 2px rgba(255,255,255,0.4) inset;
}
.checkout-total {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.3;
}
.checkout-total strong {
  display: block;
  color: var(--accent);
  font: 600 26px var(--serif);
  margin-top: 2px;
  letter-spacing: -0.01em;
}
.checkout-total span {
  display: block;
  margin-top: 2px;
}
.primary {
  border: 0;
  background: var(--accent);
  color: #fff;
  border-radius: 22px;
  padding: 13px 24px;
  min-height: 46px;
  min-width: 120px;
  cursor: pointer;
  font-weight: 600;
  font-size: 15px;
  transition: all 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.primary:active {
  transform: scale(0.98);
  background: oklch(48% 0.12 28);
}

/* Confirmation page */
.confirm-wrapper { width:100%; height:100%; max-width:430px; margin:auto; position:relative; display:flex; flex-direction:column; background:radial-gradient(60% 80% at 50% 0%,oklch(98% 0.006 85) 0%,var(--bg) 60%); }
.confirm-main { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; padding:calc(env(safe-area-inset-top) + var(--device-status-height) + var(--navigation-top-gap) + var(--navigation-height) + 30px) 20px var(--checkout-safe-space); }
.confirm-intro { text-align:center; margin-bottom:26px; }
.confirm-intro h2 { font:500 28px/1.25 var(--serif); letter-spacing:.02em; margin:0 0 8px; }
.confirm-intro p,.empty-order p { color:var(--muted); font-size:14px; margin:0; }
.order-card { padding:8px 22px; }
.order-row { display:flex; gap:20px; justify-content:space-between; align-items:baseline; padding:17px 0; border-bottom:.5px solid var(--line); }
.order-row:last-child { border-bottom:0; }
.order-label { color:var(--muted); font-size:14px; flex:0 0 auto; }
.order-value { font-weight:500; font-size:15px; text-align:right; overflow-wrap:anywhere; }
.confirm-actions { display:flex; align-items:center; gap:12px; }
.secondary { border:0; background:oklch(95% 0.004 90); color:var(--ink); border-radius:22px; min-height:46px; padding:12px 18px; font-weight:600; cursor:pointer; }
.empty-order { margin:auto 20px; padding:32px 24px; text-align:center; }
.empty-order h2 { margin:0 0 10px; font:500 24px/1.3 var(--serif); }

/* Bottom sheet */
.bottom-sheet {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: flex-end;
  opacity: 0;
  transition: opacity 0.25s ease;
}
.bottom-sheet.active {
  opacity: 1;
}
.sheet-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.sheet-content {
  position: relative;
  width: 100%;
  max-width: 430px;
  margin: auto;
  background: var(--paper);
  border-radius: 26px 26px 0 0;
  padding-bottom: env(safe-area-inset-bottom);
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1);
}
.bottom-sheet.active .sheet-content {
  transform: translateY(0);
}
.sheet-header {
  padding: 24px 24px 18px;
  border-bottom: 0.5px solid var(--line);
}
.sheet-header h3 {
  margin: 0;
  font: 500 20px/1.3 var(--serif);
  letter-spacing: 0.01em;
}
.sheet-body {
  padding: 20px 24px;
}
.confirm-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 12px 0;
  border-bottom: 0.5px solid var(--line);
}
.confirm-row:last-child {
  border-bottom: none;
}
.confirm-row.total-row {
  padding-top: 18px;
  margin-top: 8px;
  border-top: 0.5px solid var(--line);
}
.confirm-label {
  font-size: 14px;
  color: var(--muted);
}
.confirm-value {
  font-size: 15px;
  font-weight: 500;
  text-align: right;
}
.confirm-value.accent {
  color: var(--accent);
  font: 600 22px var(--serif);
  letter-spacing: -0.01em;
}
.sheet-actions {
  padding: 20px 24px;
  display: flex;
  gap: 12px;
}
.sheet-btn {
  flex: 1;
  border: 0;
  border-radius: 20px;
  padding: 13px 20px;
  min-height: 46px;
  cursor: pointer;
  font-weight: 600;
  font-size: 15px;
  transition: all 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.cancel-btn {
  background: oklch(95% 0.004 90);
  color: var(--ink);
}
.cancel-btn:active {

    const valid=order && typeof order.ticket_id==='string' && typeof order.ticket_name==='string' && Number.isInteger(order.quantity) && order.quantity>=1 && order.quantity<=20 && typeof order.contact_name==='string' && order.contact_name.trim() && typeof order.contact_phone==='string' && order.contact_phone.trim() && Number.isFinite(Number(order.total_yuan));
    const capsule=`<div class="wx-capsule"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="5" r="1.5" fill="currentColor"/><circle cx="10" cy="10" r="1.5" fill="currentColor"/><circle cx="10" cy="15" r="1.5" fill="currentColor"/></svg><div class="wx-divider"></div><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="6" stroke="currentColor" stroke-width="1.5" fill="none"/></svg></div>`;
    const back=()=>ticketBack(valid?`detail=${encodeURIComponent(order.ticket_id)}`:'select');
    document.body.innerHTML=valid?`<div class="confirm-wrapper"><header class="topbar-fixed"><button class="back" aria-label="返回修改">‹</button><span class="topbar-spacer" aria-hidden="true"></span>${capsule}</header><main class="confirm-main"><section class="confirm-intro"><h2>确认购票信息</h2><p>请核对以下信息后提交</p></section><section class="info-card order-card"><div class="order-row"><span class="order-label">门票</span><span class="order-value">${order.ticket_name}</span></div><div class="order-row"><span class="order-label">数量</span><span class="order-value">${order.quantity} 张</span></div><div class="order-row"><span class="order-label">姓名</span><span class="order-value">${order.contact_name}</span></div><div class="order-row"><span class="order-label">电话</span><span class="order-value">${order.contact_phone}</span></div></section></main><footer class="checkout"><div class="checkout-total">合计金额<strong>${yuan(order.total_yuan)}</strong></div><div class="confirm-actions"><button class="secondary" id="edit-order">返回修改</button><button class="primary" id="confirm-order">确认提交</button></div></footer></div>`:`<div class="confirm-wrapper"><header class="topbar-fixed"><button class="back" aria-label="返回门票选择">‹</button><span class="topbar-spacer" aria-hidden="true"></span>${capsule}</header><main class="confirm-main"><section class="info-card empty-order"><h2>暂无待确认的订单信息</h2><p>请从门票详情页填写信息后继续。</p><button class="primary" id="return-select" style="margin-top:24px">返回门票选择</button></section></main></div>`;
    $('.back').onclick=back;
    if(!valid){ $('#return-select').onclick=()=>location.hash='select'; return; }
    $('#edit-order').onclick=back;
    $('#confirm-order').onclick=()=>showSuccessModal(()=>{sessionStorage.removeItem('p06_pending_order');location.hash='select';});
    requestAnimationFrame(()=>{ const checkout=$('.checkout'); if(checkout) document.documentElement.style.setProperty('--checkout-height',`${checkout.getBoundingClientRect().height}px`); });
  }

  function showConfirmSheet(ticket, quantity, date, name, phone) {
    const maskPhone = phone.replace(/(\d{3})\d+(\d{4})/, '$1****$2');
    const dateObj = new Date(date);
    const displayDate = `${dateObj.getFullYear()}年${dateObj.getMonth()+1}月${dateObj.getDate()}日`;

    const sheet = document.createElement('div');
    sheet.className = 'bottom-sheet';
    sheet.innerHTML = `
      <div class="sheet-backdrop"></div>
      <div class="sheet-content">
        <div class="sheet-header">
          <h3>确认预约信息</h3>
        </div>
        <div class="sheet-body">
          <div class="confirm-row">
            <span class="confirm-label">票种</span>
            <span class="confirm-value">${ticket.name}</span>
          </div>
          <div class="confirm-row">
            <span class="confirm-label">参观日期</span>
            <span class="confirm-value">${displayDate}</span>
          </div>
          <div class="confirm-row">
            <span class="confirm-label">购票数量</span>
            <span class="confirm-value">${quantity} 张</span>
          </div>
          <div class="confirm-row">
            <span class="confirm-label">联系人</span>
            <span class="confirm-value">${name}</span>
          </div>
          <div class="confirm-row">
            <span class="confirm-label">手机号码</span>
            <span class="confirm-value">${maskPhone}</span>
          </div>
          <div class="confirm-row total-row">
            <span class="confirm-label">合计金额</span>
            <span class="confirm-value accent">${yuan(ticket.price_yuan * quantity)}</span>
          </div>
        </div>
        <div class="sheet-actions">
          <button class="sheet-btn cancel-btn">取消</button>
          <button class="sheet-btn confirm-btn">确认提交</button>
        </div>
      </div>
    `;

    document.body.appendChild(sheet);
    setTimeout(() => sheet.classList.add('active'), 10);

    const closeSheet = () => {
      sheet.classList.remove('active');
      setTimeout(() => sheet.remove(), 250);
    };

    sheet.querySelector('.sheet-backdrop').onclick = closeSheet;
    sheet.querySelector('.cancel-btn').onclick = closeSheet;
    sheet.querySelector('.confirm-btn').onclick = () => {
      closeSheet();
      setTimeout(() => showSuccessModal(), 300);
    };
  }

  function showSuccessModal(onComplete) {
    const modal = document.createElement('div');
    modal.className = 'success-modal';
    modal.innerHTML = `
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <div class="modal-icon">
          <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
            <circle cx="28" cy="28" r="27" stroke="var(--accent)" stroke-width="2"/>
            <path d="M16 28L24 36L40 20" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h3>信息已确认</h3>
        <button class="modal-btn">完成</button>
      </div>
    `;

    document.body.appendChild(modal);
    setTimeout(() => modal.classList.add('active'), 10);

    const close=()=>{
      modal.classList.remove('active');
      setTimeout(()=>{modal.remove();if(onComplete)onComplete();},250);
    };
    modal.querySelector('.modal-btn').onclick=close;
    modal.querySelector('.modal-backdrop').onclick=close;
  }

  async function start() {
    try {
      const tickets=await loadTickets();
      const route=decodeURIComponent(location.hash.slice(1));
      if(route === 'confirm') { confirmationPage(); return; }
      const id=route.startsWith('detail=') ? route.slice(7) : null;
      if(id){
        const ticket=tickets.find(t=>t.ticket_id===id)||tickets[0];
        detailPage(tickets,ticket);
      } else {
        selectPage(tickets);
      }
    } catch(e) {
      document.body.innerHTML=`<div class="select-wrapper"><main class="select-main"><p class="intro">${e.message}。请通过本目录的本地服务器打开页面。</p></main></div>`;
    }
  }

  window.addEventListener('hashchange', start);
  return { start };
})();
</script>
  <script>
  const syncMasterTitle = () => {
    const route = decodeURIComponent(location.hash.slice(1));
    const label = route === 'confirm' ? 'P06 确认订单' : route.startsWith('detail=') ? 'P06 门票详情' : 'P06 门票预约';
    parent.postMessage({type:'p06-title', label, route:location.hash}, '*');
  };
  window.addEventListener('hashchange', syncMasterTitle);
  syncMasterTitle();
P06.start();</script>
</body></html>
