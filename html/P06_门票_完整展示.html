<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>新叶村数字导览 · P06 门票完整流程</title>
  <style>
    :root {
      --bg: oklch(98% 0.004 95);
      --surface: oklch(99.5% 0.002 90);
      --fg: oklch(20% 0.018 70);
      --muted: oklch(48% 0.012 70);
      --border: oklch(90% 0.006 95);
      --accent: oklch(52% 0.10 28);
      --font-display: 'Songti SC', 'STSong', 'SimSun', Georgia, serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif;
      --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: radial-gradient(60% 80% at 50% 0%, oklch(98% 0.006 85) 0%, var(--bg) 60%);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      padding: 32px;
    }
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .caption {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .caption strong { color: var(--fg); font-weight: 500; }
    .device {
      position: relative;
      width: 390px;
      height: 844px;
      border-radius: 56px;
      padding: 12px;
      background: linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 0 0 2px #000 inset,
        0 28px 60px -12px rgba(0,0,0,0.45),
        0 8px 20px -8px rgba(0,0,0,0.35);
      isolation: isolate;
    }
    .device::before, .device::after {
      content: '';
      position: absolute;
      width: 3px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.06) 8%, transparent 16%, transparent 84%, rgba(255,255,255,0.04) 92%, transparent);
      top: 100px;
      bottom: 100px;
      pointer-events: none;
    }
    .device::before { left: -1px; }
    .device::after { right: -1px; }
    .island {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 124px;
      height: 36px;
      background: #000;
      border-radius: 999px;
      z-index: 5;
    }
    .btn-rail {
      position: absolute;
      width: 4px;
      background: #0a0a0c;
      border-radius: 2px;
    }
    .btn-rail.left-1 { left: -3px; top: 174px; height: 32px; }
    .btn-rail.left-2 { left: -3px; top: 220px; height: 60px; }
    .btn-rail.left-3 { left: -3px; top: 290px; height: 60px; }
    .btn-rail.right-1 { right: -3px; top: 250px; height: 100px; }
    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--bg);
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .statusbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 47px;
      padding: 18px 26px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: -0.01em;
      z-index: 20;
    }
    .statusbar .right { display: inline-flex; align-items: center; gap: 6px; }
    .statusbar svg { width: 17px; height: 11px; fill: var(--fg); }
    .statusbar .battery { width: 25px; }
    .content {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }
    .content::-webkit-scrollbar { display: none; }
    .home-indicator {
      flex: 0 0 28px;
      position: relative;
    }
    .home-indicator::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: var(--fg);
      border-radius: 999px;
      opacity: 0.85;
    }
  </style>
<link rel="stylesheet" href="../assets/styles/presentation.css">
<script src="../js/chrome.js" defer></script>
<script src="../js/navigation.js" defer></script>
</head>
<body>
  <div class="stage">
    <div class="caption">新叶村数字导览 · <strong id="p06-master-title">P06 门票预约</strong></div>
    <div class="device unified-device">
<i class="unified-rail r1" aria-hidden="true"></i><i class="unified-rail r2" aria-hidden="true"></i><i class="unified-rail r3" aria-hidden="true"></i><i class="unified-rail r4" aria-hidden="true"></i><i class="unified-island" aria-hidden="true"></i>
      <div class="screen">
        <div class="statusbar">
          <span>9:41</span>
          <div class="right">
            <svg viewBox="0 0 17 11"><path d="M0,5.5 L1.5,3.5 L3.5,5.5 L6.5,0.5 L9,4 L10.5,2.5 L13,7.5 L15,4.5 L17,6.5" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
            <svg viewBox="0 0 17 11"><path d="M1 3C1 2.4 1.4 2 2 2h2.5C5 1.3 5.5 1 6 1h5c.5 0 1 .3 1 .7V2h2.5c.6 0 1 .4 1 1v6c0 .6-.4 1-1 1H2c-.6 0-1-.4-1-1V3z" fill="currentColor"/><path d="M14 5.5c.8 0 1.5.7 1.5 1.5v2c0 .8-.7 1.5-1.5 1.5" stroke="currentColor" stroke-width="1" fill="none"/></svg>
            <svg viewBox="0 0 25 11" class="battery"><rect x="0" y="1.5" width="20" height="8" rx="2" stroke="currentColor" stroke-width="1" fill="none"/><rect x="2" y="3.5" width="16" height="4" rx="1" fill="currentColor"/><rect x="21" y="4" width="2" height="3" rx="1" fill="currentColor"/></svg>
          </div>
        </div>
        <div class="content">
          <iframe id="p06-app" title="P06 门票完整流程" src="about:blank" style="position:absolute;inset:0;width:100%;height:100%;border:0;"></iframe>
        </div>
        <div class="home-indicator"></div>
      </div>
    </div>
  </div>
<script>
  const p06Frame = document.getElementById('p06-app');
  p06Frame.src='门票内容.html' + window.location.hash;
  window.addEventListener('message', event => {
    if(event.source === p06Frame.contentWindow && event.data?.type === 'p06-back'){window.Xinye?.ticketReturn();return;}
    if (event.source === p06Frame.contentWindow && event.data && event.data.type === 'p06-title') {
      document.getElementById('p06-master-title').textContent = event.data.label;
      if (typeof event.data.route === 'string' && /^#?(?:select|confirm|detail=[a-z0-9-]+)?$/.test(event.data.route)) {
        history.replaceState(history.state, '', location.pathname + location.search + event.data.route);
      }
    }
  });
</script>
</body>
</html>
