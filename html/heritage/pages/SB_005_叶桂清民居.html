<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>叶桂清民居 · 新叶村数字导览</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../../../assets/styles/heritage.css"><link rel="stylesheet" href="../../../assets/styles/presentation.css"><script src="../../../js/chrome.js" defer></script><script src="../../../js/navigation.js" defer></script><script src="../../../js/heritage.js" defer></script></head><body class="heritage-page"><main class="stage"><section class="device"><div class="screen p05-page"><div class="p05-scroll-content"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="capsule">▮▮ <span class="battery"></span></span></div><div class="wechat-capsule" aria-hidden="true"><span class="dot-menu"></span><span class="circle-dot"></span></div><section class="p05-hero"><img class="p05-hero-img" src="../assets/images/SB_005/01.jpg" alt="叶桂清民居主视觉"><div class="p05-top-actions"><a class="p05-back-btn" href="../index.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div></section><article class="p05-content-panel"><div class="p05-badges"><span class="p05-badge p05-badge--protect">省保</span><span class="p05-badge p05-badge--type">传统民居</span></div><span class="p05-tagline">街面与侧巷之间的老宅</span><h1 class="p05-spot-name">叶桂清民居</h1><p class="p05-summary">叶桂清民居是省级文物保护单位“新叶村乡土建筑”的组成部分，是新叶村保存的一处传统民居。</p><div class="p05-details"><section class="p05-section"><div class="p05-section-number">01</div><h2 class="p05-section-title">面向道路的建筑正面</h2><figure class="p05-figure"><div class="p05-section-image-wrap wide"><img class="p05-section-image" loading="lazy" src="../assets/images/SB_005/02.jpg" alt="建筑正面"></div><figcaption class="p05-image-title">建筑正面</figcaption></figure><p class="p05-section-text">站在道路一侧，建筑与村中通路直接相连。住宅外部界面沿街展开，轮廓清楚而平实。</p></section><section class="p05-section"><div class="p05-section-number">02</div><h2 class="p05-section-title">转入侧旁巷道</h2><figure class="p05-figure"><div class="p05-section-image-wrap vertical"><img class="p05-section-image" loading="lazy" src="../assets/images/SB_005/03.jpg" alt="建筑侧面"></div><figcaption class="p05-image-title">建筑侧面</figcaption></figure><p class="p05-section-text">来到侧面，视线从建筑正面转向墙体与巷道之间的关系。两个方向共同呈现老宅如何处在古村连续的通行空间中。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
