，侧立面则补充它与周围空间的关系。两个方向在转角处衔接，使住宅在古村连续建筑界面中的位置更加清楚。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
