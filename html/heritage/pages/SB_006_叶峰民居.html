道。两条通行空间在转角处相接，也让住宅成为古村道路网络的一部分。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
