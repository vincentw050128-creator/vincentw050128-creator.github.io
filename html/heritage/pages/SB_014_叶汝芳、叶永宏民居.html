<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>叶汝芳、叶永宏民居 · 新叶村数字导览</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../../../assets/styles/heritage.css"><link rel="stylesheet" href="../../../assets/styles/presentation.css"><script src="../../../js/chrome.js" defer></script><script src="../../../js/navigation.js" defer></script><script src="../../../js/heritage.js" defer></script></head><body class="heritage-page"><main class="stage"><section class="device"><div class="screen p05-page"><div class="p05-scroll-content"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="capsule">▮▮ <span class="battery"></span></span></div><div class="wechat-capsule" aria-hidden="true"><span class="dot-menu"></span><span class="circle-dot"></span></div><section class="p05-hero"><img class="p05-hero-img" src="../assets/images/SB_014/01.jpg" alt="叶汝芳、叶永宏民居主视觉"><div class="p05-top-actions"><a class="p05-back-btn" href="../index.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div></section><article class="p05-content-panel"><div class="p05-badges"><span class="p05-badge p05-badge--protect">省保</span><span class="p05-badge p05-badge--type">传统民居</span></div><span class="p05-tagline">从巷道抵达一处门前</span><h1 class="p05-spot-name">叶汝芳、叶永宏民居</h1><p class="p05-summary">叶汝芳、叶永宏民居是省级文物保护单位“新叶村乡土建筑”的组成部分。从巷道、入口到内部廊道，空间由外向内逐步收拢。</p><div class="p05-details"><section class="p05-section"><div class="p05-section-number">01</div><h2 class="p05-section-title">巷道与入口</h2><figure class="p05-figure"><div class="p05-section-image-wrap vertical"><img class="p05-section-image" loading="lazy" src="../assets/images/SB_014/02.jpg" alt="入口门楼"></div><figcaption class="p05-image-title">入口门楼</figcaption></figure><p class="p05-section-text">从巷道接近，入口成为公共通路与住宅空间之间的转折点。立面沿巷展开，也让建筑边界参与构成古村步行环境。</p></section><section class="p05-section"><div class="p05-section-number">02</div><h2 class="p05-section-title">从外部转向内部</h2><figure class="p05-figure"><div class="p05-section-image-wrap wide"><img class="p05-section-image" loading="lazy" src="../assets/images/SB_014/03.jpg" alt="立面与巷道"></div><figcaption class="p05-image-title">立面与巷道</figcaption></figure><p class="p05-section-text">越过入口，视线从街巷转向内部廊道。光线随空间收拢而变得柔和，行走也由开放的村巷进入较为安静的住宅内部。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
