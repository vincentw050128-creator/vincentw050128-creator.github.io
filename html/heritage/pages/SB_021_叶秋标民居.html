<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>叶秋标民居 · 新叶村数字导览</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../../../assets/styles/heritage.css"><link rel="stylesheet" href="../../../assets/styles/presentation.css"><script src="../../../js/chrome.js" defer></script><script src="../../../js/navigation.js" defer></script><script src="../../../js/heritage.js" defer></script></head><body class="heritage-page"><main class="stage"><section class="device"><div class="screen p05-page"><div class="p05-scroll-content"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="capsule">▮▮ <span class="battery"></span></span></div><div class="wechat-capsule" aria-hidden="true"><span class="dot-menu"></span><span class="circle-dot"></span></div><section class="p05-hero"><img class="p05-hero-img" src="../assets/images/SB_021/01.jpg" alt="叶秋标民居主视觉"><div class="p05-top-actions"><a class="p05-back-btn" href="../index.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div></section><article class="p05-content-panel"><div class="p05-badges"><span class="p05-badge p05-badge--protect">省保</span><span class="p05-badge p05-badge--type">传统民居</span></div><span class="p05-tagline">周边环境中的一座老宅</span><h1 class="p05-spot-name">叶秋标民居</h1><p class="p05-summary">叶秋标民居是省级文物保护单位“新叶村乡土建筑”的组成部分。由周边环境走向侧旁入口，空间从村落尺度逐渐收拢到门前。</p><div class="p05-details"><section class="p05-section"><div class="p05-section-number">01</div><h2 class="p05-section-title">住宅所在的村落环境</h2><figure class="p05-figure"><div class="p05-section-image-wrap wide"><img class="p05-section-image" loading="lazy" src="../assets/images/SB_021/02.jpg" alt="周边环境"></div><figcaption class="p05-image-title">周边环境</figcaption></figure><p class="p05-section-text">稍远处望去，住宅、邻近屋舍与道路一同进入视野。老宅并不孤立，而是顺着聚落肌理与周围空间自然衔接。</p></section><section class="p05-section"><div class="p05-section-number">02</div><h2 class="p05-section-title">侧旁入口</h2><figure class="p05-figure"><div class="p05-section-image-wrap vertical"><img class="p05-section-image" loading="lazy" src="../assets/images/SB_021/03.jpg" alt="侧面入口"></div><figcaption class="p05-image-title">侧面入口</figcaption></figure><p class="p05-section-text">来到侧面，入口与附近通行空间形成明确联系。由周围屋舍走到门前，尺度也从村落收拢到一处具体住宅。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
