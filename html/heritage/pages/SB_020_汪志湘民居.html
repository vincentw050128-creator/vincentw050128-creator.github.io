后，注意力逐渐落在入口及其与通路的连接上。距离的变化，让建筑由村居背景变成一处可以细看和进入的空间。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
