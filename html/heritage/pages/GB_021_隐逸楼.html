<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隐逸楼 · 新叶村数字导览</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../../../assets/styles/heritage.css"><link rel="stylesheet" href="../../../assets/styles/presentation.css"><script src="../../../js/chrome.js" defer></script><script src="../../../js/navigation.js" defer></script><script src="../../../js/heritage.js" defer></script></head><body class="heritage-page"><main class="stage"><section class="device"><div class="screen p05-page"><div class="p05-scroll-content"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="capsule">▮▮ <span class="battery"></span></span></div><div class="wechat-capsule" aria-hidden="true"><span class="dot-menu"></span><span class="circle-dot"></span></div><section class="p05-hero"><img class="p05-hero-img" src="../assets/images/GB_021/01.jpg" alt="隐逸楼主视觉"><div class="p05-top-actions"><a class="p05-back-btn" href="../index.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div></section><article class="p05-content-panel"><div class="p05-badges"><span class="p05-badge p05-badge--protect">国保</span><span class="p05-badge p05-badge--type">传统民居</span></div><span class="p05-tagline">屋脊之间的一座小楼</span><h1 class="p05-spot-name">隐逸楼</h1><p class="p05-summary">隐逸楼是全国重点文物保护单位“新叶村乡土建筑”中的一座传统民居。“楼”字留在名称里，也让它在村中众多堂、居、宅之间拥有了鲜明的识别方式。</p><div class="p05-details"><section class="p05-section"><div class="p05-section-number">01</div><h2 class="p05-section-title">沿巷看见侧墙</h2><figure class="p05-figure"><div class="p05-section-image-wrap wide"><img class="p05-section-image" loading="lazy" src="../assets/images/GB_021/02.jpg" alt="隐逸楼侧墙与巷道"></div><figcaption class="p05-image-title">隐逸楼侧墙与巷道</figcaption></figure><p class="p05-section-text">沿着村巷接近隐逸楼，侧墙与通行空间共同收拢视线。这里适合从贴近地面的尺度观察一座老宅如何嵌入街巷，而不是把它当成孤立的单体。</p></section><section class="p05-section"><div class="p05-section-number">02</div><h2 class="p05-section-title">从屋面辨认村落</h2><figure class="p05-figure"><div class="p05-section-image-wrap wide"><img class="p05-section-image" loading="lazy" src="../assets/images/GB_021/03.jpg" alt="隐逸楼及周边屋面航拍"></div><figcaption class="p05-image-title">隐逸楼及周边屋面航拍</figcaption></figure><p class="p05-section-text">从较高处望去，隐逸楼的屋面回到新叶村连续的屋顶之中。单体与聚落同时显现，也说明这座建筑的价值既在自身，也在它与周围老宅共同形成的整体环境。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
