<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雍睦堂 · 新叶村数字导览</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../../../assets/styles/heritage.css"><link rel="stylesheet" href="../../../assets/styles/presentation.css"><script src="../../../js/chrome.js" defer></script><script src="../../../js/navigation.js" defer></script><script src="../../../js/heritage.js" defer></script></head><body class="heritage-page"><main class="stage"><section class="device"><div class="screen p05-page"><div class="p05-scroll-content"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="capsule">▮▮ <span class="battery"></span></span></div><div class="wechat-capsule" aria-hidden="true"><span class="dot-menu"></span><span class="circle-dot"></span></div><section class="p05-hero"><img class="p05-hero-img" src="../assets/images/SB_002/01.jpg" alt="雍睦堂主视觉"><div class="p05-top-actions"><a class="p05-back-btn" href="../index.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div></section><article class="p05-content-panel"><div class="p05-badges"><span class="p05-badge p05-badge--protect">省保</span><span class="p05-badge p05-badge--type">宗祠建筑</span></div><span class="p05-tagline">西北村角，旧祠犹存</span><h1 class="p05-spot-name">雍睦堂</h1><p class="p05-summary">雍睦堂是新叶村的省级文物保护单位，也是叶氏宗祠体系的一部分。与规模完整的总祠相比，它保存的是一座支祠经历变迁后的具体面貌。</p><div class="p05-details"><section class="p05-section"><div class="p05-section-number">01</div><h2 class="p05-section-title">三进只余一进的老祠</h2><p class="p05-section-text">雍睦堂原本是一座三进的祠堂，历经岁月，如今只剩下最后一进保存下来。即便如此，它临街的厅堂门面依旧完整，粗大的木构与卷棚廊檐，仍能让人想见它当年规整的格局。</p></section><section class="p05-section"><div class="p05-section-number">02</div><h2 class="p05-section-title">村西北的公共建筑片区</h2><figure class="p05-figure"><div class="p05-section-image-wrap wide"><img class="p05-section-image" loading="lazy" src="../assets/images/SB_002/02.jpg" alt="层叠马头墙与临街高墙"></div><figcaption class="p05-image-title">层叠马头墙与临街高墙</figcaption></figure><p class="p05-section-text">雍睦堂所在的村西北一带，曾是新叶村重要公共建筑较为集中的片区。沿街可见层叠马头墙与连续高墙，祠堂和周边老屋共同形成村角清晰而紧凑的轮廓。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
