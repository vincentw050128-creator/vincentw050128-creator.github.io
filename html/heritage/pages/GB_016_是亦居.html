<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>是亦居 · 新叶村数字导览</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../../../assets/styles/heritage.css"><link rel="stylesheet" href="../../../assets/styles/presentation.css"><script src="../../../js/chrome.js" defer></script><script src="../../../js/navigation.js" defer></script><script src="../../../js/heritage.js" defer></script></head><body class="heritage-page"><main class="stage"><section class="device"><div class="screen p05-page"><div class="p05-scroll-content"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="capsule">▮▮ <span class="battery"></span></span></div><div class="wechat-capsule" aria-hidden="true"><span class="dot-menu"></span><span class="circle-dot"></span></div><section class="p05-hero"><img class="p05-hero-img" src="../assets/images/GB_016/01.jpg" alt="是亦居主视觉"><div class="p05-top-actions"><a class="p05-back-btn" href="../index.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div></section><article class="p05-content-panel"><div class="p05-badges"><span class="p05-badge p05-badge--protect">国保</span><span class="p05-badge p05-badge--type">传统民居</span></div><span class="p05-tagline">小院之内，自有章法</span><h1 class="p05-spot-name">是亦居</h1><p class="p05-summary">是亦居是全国重点文物保护单位“新叶村乡土建筑”中的一座三合院式民居。两侧厢房、中间天井与正堂共同围合出紧凑的起居空间，保留着新叶普通宅院因地制宜的布局特点。</p><div class="p05-details"><section class="p05-section"><div class="p05-section-number">01</div><h2 class="p05-section-title">厢房充当的门厅</h2><figure class="p05-figure"><div class="p05-section-image-wrap wide"><img class="p05-section-image" loading="lazy" src="../assets/images/GB_016/02.jpg" alt="是亦居航拍"></div><figcaption class="p05-image-title">是亦居航拍</figcaption></figure><p class="p05-section-text">新叶村的三合院多由两侧厢房、中间天井与正堂组成，大门常开在其中一侧的厢房位置。是亦居正是这样一处宅子——它没有单设门厅，而是让一间厢房兼作出入的门厅之用。这种因地制宜的做法，是村中普通人家在有限宅基上安排起居的实在智慧。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
