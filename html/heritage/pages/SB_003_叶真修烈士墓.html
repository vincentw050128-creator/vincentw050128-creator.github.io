<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>叶真修烈士墓 · 新叶村数字导览</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../../../assets/styles/heritage.css"><link rel="stylesheet" href="../../../assets/styles/presentation.css"><script src="../../../js/chrome.js" defer></script><script src="../../../js/navigation.js" defer></script><script src="../../../js/heritage.js" defer></script></head><body class="heritage-page"><main class="stage"><section class="device"><div class="screen p05-page"><div class="p05-scroll-content"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="capsule">▮▮ <span class="battery"></span></span></div><div class="wechat-capsule" aria-hidden="true"><span class="dot-menu"></span><span class="circle-dot"></span></div><section class="p05-hero"><img class="p05-hero-img" src="../assets/images/SB_003/01.jpg" alt="叶真修烈士墓主视觉"><div class="p05-top-actions"><a class="p05-back-btn" href="../index.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div></section><article class="p05-content-panel"><div class="p05-badges"><span class="p05-badge p05-badge--protect">省保</span><span class="p05-badge p05-badge--type">烈士墓（纪念性文物）</span></div><span class="p05-tagline">故乡为烈士留下的纪念地</span><h1 class="p05-spot-name">叶真修烈士墓</h1><p class="p05-summary">叶真修烈士墓位于新叶自然村南面，是省级文物保护单位“新叶村乡土建筑”的组成部分。这里纪念着从新叶村走出的革命烈士叶真修。</p><div class="p05-details"><section class="p05-section"><div class="p05-section-number">01</div><h2 class="p05-section-title">新叶走出的革命烈士</h2><figure class="p05-figure"><div class="p05-section-image-wrap wide"><img class="p05-section-image" loading="lazy" src="../assets/images/SB_003/02.jpg" alt="墓体近景"></div><figcaption class="p05-image-title">墓体近景</figcaption></figure><p class="p05-section-text">叶真修生于1895年，家谱记载为叶正修。1928年，他参加农民革命时被俘牺牲；1953年，寿昌县政府追认他为革命烈士。</p></section><section class="p05-section"><div class="p05-section-number">02</div><h2 class="p05-section-title">村南的纪念空间</h2><figure class="p05-figure"><div class="p05-section-image-wrap wide"><img class="p05-section-image" loading="lazy" src="../assets/images/SB_003/03.jpg" alt="纪念环境"></div><figcaption class="p05-image-title">纪念环境</figcaption></figure><p class="p05-section-text">烈士墓设置在新叶自然村南面。墓体与周围纪念环境共同构成凭吊空间，使叶真修的革命经历在故乡拥有一处可以到访和追思的实体地点。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
