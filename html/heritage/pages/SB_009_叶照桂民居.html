<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>叶照桂民居 · 新叶村数字导览</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../../../assets/styles/heritage.css"><link rel="stylesheet" href="../../../assets/styles/presentation.css"><script src="../../../js/chrome.js" defer></script><script src="../../../js/navigation.js" defer></script><script src="../../../js/heritage.js" defer></script></head><body class="heritage-page"><main class="stage"><section class="device"><div class="screen p05-page"><div class="p05-scroll-content"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="capsule">▮▮ <span class="battery"></span></span></div><div class="wechat-capsule" aria-hidden="true"><span class="dot-menu"></span><span class="circle-dot"></span></div><section class="p05-hero"><img class="p05-hero-img" src="../assets/images/SB_009/01.jpg" alt="叶照桂民居主视觉"><div class="p05-top-actions"><a class="p05-back-btn" href="../index.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div></section><article class="p05-content-panel"><div class="p05-badges"><span class="p05-badge p05-badge--protect">省保</span><span class="p05-badge p05-badge--type">传统民居</span></div><span class="p05-tagline">一座民居的近看与俯瞰</span><h1 class="p05-spot-name">叶照桂民居</h1><p class="p05-summary">叶照桂民居是省级文物保护单位“新叶村乡土建筑”的组成部分。走近可见住宅正面，登高则能望见它与周围屋舍连成一片。</p><div class="p05-details"><section class="p05-section"><div class="p05-section-number">01</div><h2 class="p05-section-title">接近建筑正面</h2><figure class="p05-figure"><div class="p05-section-image-wrap vertical"><img class="p05-section-image" loading="lazy" src="../assets/images/SB_009/02.jpg" alt="正立面景观"></div><figcaption class="p05-image-title">正立面景观</figcaption></figure><p class="p05-section-text">从街面接近，住宅正面构成最直接的外部界面。走到近处，建筑从周围屋舍中逐渐显现，也建立起人与老宅之间的近距离尺度。</p></section><section class="p05-section"><div class="p05-section-number">02</div><h2 class="p05-section-title">回到连片屋面</h2><figure class="p05-figure"><div class="p05-section-image-wrap wide"><img class="p05-section-image" loading="lazy" src="../assets/images/SB_009/03.jpg" alt="航拍鸟瞰"></div><figcaption class="p05-image-title">航拍鸟瞰</figcaption></figure><p class="p05-section-text">从较高处望去，单体重新融入周围连续的屋顶。近处的门墙与远处的屋脊相互补充，让一座民居和整个古村联系起来。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
