<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>荣寿堂 · 新叶村数字导览</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../../../assets/styles/heritage.css"><link rel="stylesheet" href="../../../assets/styles/presentation.css"><script src="../../../js/chrome.js" defer></script><script src="../../../js/navigation.js" defer></script><script src="../../../js/heritage.js" defer></script></head><body class="heritage-page"><main class="stage"><section class="device"><div class="screen p05-page"><div class="p05-scroll-content"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="capsule">▮▮ <span class="battery"></span></span></div><div class="wechat-capsule" aria-hidden="true"><span class="dot-menu"></span><span class="circle-dot"></span></div><section class="p05-hero"><img class="p05-hero-img" src="../assets/images/GB_008/01.jpg" alt="荣寿堂主视觉"><div class="p05-top-actions"><a class="p05-back-btn" href="../index.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div></section><article class="p05-content-panel"><div class="p05-badges"><span class="p05-badge p05-badge--protect">国保</span><span class="p05-badge p05-badge--type">宗祠建筑</span></div><span class="p05-tagline">檐下旧雕，静守一隅</span><h1 class="p05-spot-name">荣寿堂</h1><p class="p05-summary">荣寿堂是新叶村叶氏的一座支派祠堂，也是村中保存较为完整的祠堂之一。建筑坐西北朝东南，门前原有一方水塘。</p><div class="p05-details"><section class="p05-section"><div class="p05-section-number">01</div><h2 class="p05-section-title">顺着村巷走近门楼</h2><p class="p05-section-text">从村巷走近荣寿堂，门楼、八字墙与周边老屋共同收束出一处尺度亲近的入口。它不像总祠那样拥有开阔前场，而是顺着街巷展开，使宗祠空间自然嵌入日常通行的路径。</p></section><section class="p05-section"><div class="p05-section-number">02</div><h2 class="p05-section-title">檐下的旧日木雕</h2><figure class="p05-figure"><div class="p05-section-image-wrap wide"><img class="p05-section-image" loading="lazy" src="../assets/images/GB_008/02.jpg" alt="檐下木雕与雕花雀替"></div><figcaption class="p05-image-title">檐下木雕与雕花雀替</figcaption></figure><p class="p05-section-text">荣寿堂虽不张扬，檐下的木构却颇见功夫。梁枋与雀替之间雕着人物故事与花卉禽鸟，层层叠叠，刀工细致。历经岁月，这些旧日木雕依旧清晰，透出当年匠人对这座支祠的一番用心，也是它最值得驻足细看的地方。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
