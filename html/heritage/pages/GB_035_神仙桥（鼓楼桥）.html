<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>神仙桥（鼓楼桥） · 新叶村数字导览</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../../../assets/styles/heritage.css"><link rel="stylesheet" href="../../../assets/styles/presentation.css"><script src="../../../js/chrome.js" defer></script><script src="../../../js/navigation.js" defer></script><script src="../../../js/heritage.js" defer></script></head><body class="heritage-page"><main class="stage"><section class="device"><div class="screen p05-page"><div class="p05-scroll-content"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="capsule">▮▮ <span class="battery"></span></span></div><div class="wechat-capsule" aria-hidden="true"><span class="dot-menu"></span><span class="circle-dot"></span></div><section class="p05-hero"><img class="p05-hero-img" src="../assets/images/GB_035/01.jpg" alt="神仙桥（鼓楼桥）主视觉"><div class="p05-top-actions"><a class="p05-back-btn" href="../index.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div></section><article class="p05-content-panel"><div class="p05-badges"><span class="p05-badge p05-badge--protect">国保</span><span class="p05-badge p05-badge--type">石桥</span></div><span class="p05-tagline">水道上的一处轻巧跨越</span><h1 class="p05-spot-name">神仙桥（鼓楼桥）</h1><p class="p05-summary">神仙桥又名鼓楼桥，是全国重点文物保护单位“新叶村乡土建筑”中的一座古桥。两个名称共同指向这处村落水系中的通行节点。</p><div class="p05-details"><section class="p05-section"><div class="p05-section-number">01</div><h2 class="p05-section-title">村中四座主要古桥之一</h2><figure class="p05-figure"><div class="p05-section-image-wrap wide"><img class="p05-section-image" loading="lazy" src="../assets/images/GB_035/02.jpg" alt="神仙桥桥身一景"></div><figcaption class="p05-image-title">神仙桥桥身一景</figcaption></figure><p class="p05-section-text">鼓楼桥、睦邻桥、万枝桥和下童桥并称新叶村四座主要古桥。它们分布在村落水道与道路之间，把桥梁的通行功能嵌入古村整体空间。</p></section><section class="p05-section"><div class="p05-section-number">02</div><h2 class="p05-section-title">连接两岸的日常尺度</h2><figure class="p05-figure"><div class="p05-section-image-wrap wide"><img class="p05-section-image" loading="lazy" src="../assets/images/GB_035/03.jpg" alt="神仙桥桥面与水道"></div><figcaption class="p05-image-title">神仙桥桥面与水道</figcaption></figure><p class="p05-section-text">神仙桥跨过村中水道，两端与道路相接。接近桥面时，水岸、桥身和附近屋舍同时进入视野，一座小桥也由此成为阅读新叶水系与街巷关系的入口。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
