<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>翠芳轩 · 新叶村数字导览</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../../../assets/styles/heritage.css"><link rel="stylesheet" href="../../../assets/styles/presentation.css"><script src="../../../js/chrome.js" defer></script><script src="../../../js/navigation.js" defer></script><script src="../../../js/heritage.js" defer></script></head><body class="heritage-page"><main class="stage"><section class="device"><div class="screen p05-page"><div class="p05-scroll-content"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="capsule">▮▮ <span class="battery"></span></span></div><div class="wechat-capsule" aria-hidden="true"><span class="dot-menu"></span><span class="circle-dot"></span></div><section class="p05-hero"><img class="p05-hero-img" src="../assets/images/GB_025/01.jpg" alt="翠芳轩主视觉"><div class="p05-top-actions"><a class="p05-back-btn" href="../index.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div></section><article class="p05-content-panel"><div class="p05-badges"><span class="p05-badge p05-badge--protect">国保</span><span class="p05-badge p05-badge--type">传统民居</span></div><span class="p05-tagline">院落层层，出入有序</span><h1 class="p05-spot-name">翠芳轩</h1><p class="p05-summary">翠芳轩是全国重点文物保护单位“新叶村乡土建筑”中的一座传统民居，也是一处格局特点较为清晰的四合式住宅。</p><div class="p05-details"><section class="p05-section"><div class="p05-section-number">01</div><h2 class="p05-section-title">两座四合式建筑的组合</h2><figure class="p05-figure"><div class="p05-section-image-wrap wide"><img class="p05-section-image" loading="lazy" src="../assets/images/GB_025/02.jpg" alt="翠芳轩院落内部"></div><figcaption class="p05-image-title">翠芳轩院落内部</figcaption></figure><p class="p05-section-text">翠芳轩由北侧两座四合式建筑组合而成。正房、前屋和两侧厢房围合出连续院落，厢房连接前后屋，南北两侧另有附属用房，使住宅形成较为完整的空间层次。</p></section><section class="p05-section"><div class="p05-section-number">02</div><h2 class="p05-section-title">顺着街巷安排入口</h2><figure class="p05-figure"><div class="p05-section-image-wrap wide"><img class="p05-section-image" loading="lazy" src="../assets/images/GB_025/03.jpg" alt="翠芳轩临巷侧面"></div><figcaption class="p05-image-title">翠芳轩临巷侧面</figcaption></figure><p class="p05-section-text">翠芳轩南侧邻近村中主要街巷。为了兼顾街巷关系与住宅朝向，大门设置在住宅西侧支巷，南侧附属用房另开小门兼作门厅。入口的选择，体现了宅院布局对周边道路条件的回应。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
