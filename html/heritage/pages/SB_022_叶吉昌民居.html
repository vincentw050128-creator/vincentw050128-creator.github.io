置。走到门前，原本连续的通行空间在这里转向宅内，巷道的流动与住宅的安静形成自然过渡。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
