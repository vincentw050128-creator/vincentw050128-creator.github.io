<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>叶锡寿民居 · 新叶村数字导览</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../../../assets/styles/heritage.css"><link rel="stylesheet" href="../../../assets/styles/presentation.css"><script src="../../../js/chrome.js" defer></script><script src="../../../js/navigation.js" defer></script><script src="../../../js/heritage.js" defer></script></head><body class="heritage-page"><main class="stage"><section class="device"><div class="screen p05-page"><div class="p05-scroll-content"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="capsule">▮▮ <span class="battery"></span></span></div><div class="wechat-capsule" aria-hidden="true"><span class="dot-menu"></span><span class="circle-dot"></span></div><section class="p05-hero"><img class="p05-hero-img" src="../assets/images/GB_032/01.jpg" alt="叶锡寿民居主视觉"><div class="p05-top-actions"><a class="p05-back-btn" href="../index.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div></section><article class="p05-content-panel"><div class="p05-badges"><span class="p05-badge p05-badge--protect">国保</span><span class="p05-badge p05-badge--type">传统民居</span></div><span class="p05-tagline">从屋顶走到门前</span><h1 class="p05-spot-name">叶锡寿民居</h1><p class="p05-summary">叶锡寿民居是全国重点文物保护单位“新叶村乡土建筑”的组成部分。从连片屋面到街面入口，建筑在不同距离中逐渐显现。</p><div class="p05-details"><section class="p05-section"><div class="p05-section-number">01</div><h2 class="p05-section-title">回到街面的正面</h2><figure class="p05-figure"><div class="p05-section-image-wrap wide"><img class="p05-section-image" loading="lazy" src="../assets/images/GB_032/02.jpg" alt="正面街景"></div><figcaption class="p05-image-title">正面街景</figcaption></figure><p class="p05-section-text">从连片屋面回到街面，建筑正面与村中道路形成清晰关系。走近之后，一座具体住宅从聚落背景中显现出来。</p></section><section class="p05-section"><div class="p05-section-number">02</div><h2 class="p05-section-title">侧旁入口的尺度</h2><figure class="p05-figure"><div class="p05-section-image-wrap wide"><img class="p05-section-image" loading="lazy" src="../assets/images/GB_032/03.jpg" alt="侧面入口"></div><figcaption class="p05-image-title">侧面入口</figcaption></figure><p class="p05-section-text">转到建筑侧旁，入口与邻近通行空间同时出现。正面和侧面彼此衔接，让住宅与街巷的连接方式更加清楚。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
