<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>叶瑞荣、叶毅峰民居 · 新叶村数字导览</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../../../assets/styles/heritage.css"><link rel="stylesheet" href="../../../assets/styles/presentation.css"><script src="../../../js/chrome.js" defer></script><script src="../../../js/navigation.js" defer></script><script src="../../../js/heritage.js" defer></script></head><body class="heritage-page"><main class="stage"><section class="device"><div class="screen p05-page"><div class="p05-scroll-content"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="capsule">▮▮ <span class="battery"></span></span></div><div class="wechat-capsule" aria-hidden="true"><span class="dot-menu"></span><span class="circle-dot"></span></div><section class="p05-hero"><img class="p05-hero-img" src="../assets/images/SB_015/01.jpg" alt="叶瑞荣、叶毅峰民居主视觉"><div class="p05-top-actions"><a class="p05-back-btn" href="../index.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div></section><article class="p05-content-panel"><div class="p05-badges"><span class="p05-badge p05-badge--protect">省保</span><span class="p05-badge p05-badge--type">传统民居</span></div><span class="p05-tagline">侧巷、院落与入口之间</span><h1 class="p05-spot-name">叶瑞荣、叶毅峰民居</h1><p class="p05-summary">叶瑞荣、叶毅峰民居是省级文物保护单位“新叶村乡土建筑”的组成部分。侧巷、院落与入口相互连接，呈现出住宅由外及内的空间层次。</p><div class="p05-details"><section class="p05-section"><div class="p05-section-number">01</div><h2 class="p05-section-title">侧巷形成的建筑边界</h2><figure class="p05-figure"><div class="p05-section-image-wrap wide"><img class="p05-section-image" loading="lazy" src="../assets/images/SB_015/02.jpg" alt="侧面巷道"></div><figcaption class="p05-image-title">侧面巷道</figcaption></figure><p class="p05-section-text">侧面巷道把住宅外墙与周围通行空间放在同一视野里。这里呈现的是建筑如何进入古村连续的街巷界面。</p></section><section class="p05-section"><div class="p05-section-number">02</div><h2 class="p05-section-title">院落与入口的转换</h2><figure class="p05-figure"><div class="p05-section-image-wrap vertical"><img class="p05-section-image" loading="lazy" src="../assets/images/SB_015/03.jpg" alt="入口细节"></div><figcaption class="p05-image-title">入口细节</figcaption></figure><p class="p05-section-text">院落把视线带入住宅内部，入口则标记内外空间的转换。由门前到院中，尺度逐渐收拢，也让老宅显出更安静的生活气息。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
