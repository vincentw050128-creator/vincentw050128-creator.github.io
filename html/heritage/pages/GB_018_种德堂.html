<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>种德堂 · 新叶村数字导览</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../../../assets/styles/heritage.css"><link rel="stylesheet" href="../../../assets/styles/presentation.css"><script src="../../../js/chrome.js" defer></script><script src="../../../js/navigation.js" defer></script><script src="../../../js/heritage.js" defer></script></head><body class="heritage-page"><main class="stage"><section class="device"><div class="screen p05-page"><div class="p05-scroll-content"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="capsule">▮▮ <span class="battery"></span></span></div><div class="wechat-capsule" aria-hidden="true"><span class="dot-menu"></span><span class="circle-dot"></span></div><section class="p05-hero"><img class="p05-hero-img" src="../assets/images/GB_018/01.jpg" alt="种德堂主视觉"><div class="p05-top-actions"><a class="p05-back-btn" href="../index.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div></section><article class="p05-content-panel"><div class="p05-badges"><span class="p05-badge p05-badge--protect">国保</span><span class="p05-badge p05-badge--type">传统民居</span></div><span class="p05-tagline">院落规整，起居有序</span><h1 class="p05-spot-name">种德堂</h1><p class="p05-summary">种德堂是全国重点文物保护单位“新叶村乡土建筑”中的一座传统民居。它在成片老宅之间保留着较为完整的宅院平面，是观察新叶传统居住尺度的一处代表。</p><div class="p05-details"><section class="p05-section"><div class="p05-section-number">01</div><h2 class="p05-section-title">核心地段的一座宅院</h2><figure class="p05-figure"><div class="p05-section-image-wrap vertical"><img class="p05-section-image" loading="lazy" src="../assets/images/GB_018/02.jpg" alt="种德堂现场一角"></div><figcaption class="p05-image-title">种德堂现场一角</figcaption></figure><p class="p05-section-text">种德堂占地约四百零三平方米，宅院平面保存较为完整。在新叶村紧密相连的民居中，这样一处尺度清晰、格局连贯的宅院，让人更容易理解传统家庭如何在有限村落空间中安排居住与日常生活。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
