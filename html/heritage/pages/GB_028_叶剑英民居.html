<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>叶剑英民居 · 新叶村数字导览</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../../../assets/styles/heritage.css"><link rel="stylesheet" href="../../../assets/styles/presentation.css"><script src="../../../js/chrome.js" defer></script><script src="../../../js/navigation.js" defer></script><script src="../../../js/heritage.js" defer></script></head><body class="heritage-page"><main class="stage"><section class="device"><div class="screen p05-page"><div class="p05-scroll-content"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="capsule">▮▮ <span class="battery"></span></span></div><div class="wechat-capsule" aria-hidden="true"><span class="dot-menu"></span><span class="circle-dot"></span></div><section class="p05-hero"><img class="p05-hero-img" src="../assets/images/GB_028/01.jpg" alt="叶剑英民居主视觉"><div class="p05-top-actions"><a class="p05-back-btn" href="../index.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div></section><article class="p05-content-panel"><div class="p05-badges"><span class="p05-badge p05-badge--protect">国保</span><span class="p05-badge p05-badge--type">传统民居</span></div><span class="p05-tagline">转过巷角看见老宅</span><h1 class="p05-spot-name">叶剑英民居</h1><p class="p05-summary">叶剑英民居是全国重点文物保护单位“新叶村乡土建筑”中的一座传统民居。住宅贴着村巷而立，墙面与曲折通道共同构成古村深处的日常尺度。</p><div class="p05-details"><section class="p05-section"><div class="p05-section-number">01</div><h2 class="p05-section-title">沿巷展开的建筑侧面</h2><figure class="p05-figure"><div class="p05-section-image-wrap wide"><img class="p05-section-image" loading="lazy" src="../assets/images/GB_028/02.jpg" alt="叶剑英民居临巷侧墙"></div><figcaption class="p05-image-title">叶剑英民居临巷侧墙</figcaption></figure><p class="p05-section-text">从村巷转到建筑侧旁，墙面与通行空间共同形成狭长的视线。道路贴着屋舍曲折延伸，步行其中，可以清楚感受住宅与街巷彼此依存的关系。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
