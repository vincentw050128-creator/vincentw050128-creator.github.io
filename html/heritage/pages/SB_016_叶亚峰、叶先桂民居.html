<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>叶亚峰、叶先桂民居 · 新叶村数字导览</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../../../assets/styles/heritage.css"><link rel="stylesheet" href="../../../assets/styles/presentation.css"><script src="../../../js/chrome.js" defer></script><script src="../../../js/navigation.js" defer></script><script src="../../../js/heritage.js" defer></script></head><body class="heritage-page"><main class="stage"><section class="device"><div class="screen p05-page"><div class="p05-scroll-content"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="capsule">▮▮ <span class="battery"></span></span></div><div class="wechat-capsule" aria-hidden="true"><span class="dot-menu"></span><span class="circle-dot"></span></div><section class="p05-hero"><img class="p05-hero-img" src="../assets/images/SB_016/01.jpg" alt="叶亚峰、叶先桂民居主视觉"><div class="p05-top-actions"><a class="p05-back-btn" href="../index.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div></section><article class="p05-content-panel"><div class="p05-badges"><span class="p05-badge p05-badge--protect">省保</span><span class="p05-badge p05-badge--type">传统民居</span></div><span class="p05-tagline">从门楼走入木构空间</span><h1 class="p05-spot-name">叶亚峰、叶先桂民居</h1><p class="p05-summary">叶亚峰、叶先桂民居是省级文物保护单位“新叶村乡土建筑”的组成部分。从入口门楼进入，梁架与内部通道引导视线逐步深入宅内。</p><div class="p05-details"><section class="p05-section"><div class="p05-section-number">01</div><h2 class="p05-section-title">入口门楼</h2><figure class="p05-figure"><div class="p05-section-image-wrap vertical"><img class="p05-section-image" loading="lazy" src="../assets/images/SB_016/02.jpg" alt="入口门楼"></div><figcaption class="p05-image-title">入口门楼</figcaption></figure><p class="p05-section-text">入口是街巷与住宅之间最清楚的转换界面。由此接近建筑，视线从外部通路转向内部空间。</p></section><section class="p05-section"><div class="p05-section-number">02</div><h2 class="p05-section-title">梁架与内部通道</h2><figure class="p05-figure"><div class="p05-section-image-wrap vertical"><img class="p05-section-image" loading="lazy" src="../assets/images/SB_016/03.jpg" alt="室内通道"></div><figcaption class="p05-image-title">室内通道</figcaption></figure><p class="p05-section-text">进入建筑内部，视线转向上方木构和纵深通道。木色、光影与狭长空间叠在一起，形成由门楼向宅内逐步深入的节奏。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
