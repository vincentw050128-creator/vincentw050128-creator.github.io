<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>竹堂 · 新叶村数字导览</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../../../assets/styles/heritage.css"><link rel="stylesheet" href="../../../assets/styles/presentation.css"><script src="../../../js/chrome.js" defer></script><script src="../../../js/navigation.js" defer></script><script src="../../../js/heritage.js" defer></script></head><body class="heritage-page"><main class="stage"><section class="device"><div class="screen p05-page"><div class="p05-scroll-content"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="capsule">▮▮ <span class="battery"></span></span></div><div class="wechat-capsule" aria-hidden="true"><span class="dot-menu"></span><span class="circle-dot"></span></div><section class="p05-hero"><img class="p05-hero-img" src="../assets/images/SB_001/01.jpg" alt="竹堂主视觉"><div class="p05-top-actions"><a class="p05-back-btn" href="../index.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div></section><article class="p05-content-panel"><div class="p05-badges"><span class="p05-badge p05-badge--protect">省保</span><span class="p05-badge p05-badge--type">传统建筑</span></div><span class="p05-tagline">竹堂，留在村中的一个名字</span><h1 class="p05-spot-name">竹堂</h1><p class="p05-summary">竹堂是省级文物保护单位“新叶村乡土建筑”的组成部分。“竹堂”这一名称让它在村中众多民居之间保有自己的称谓。</p><div class="p05-details"><section class="p05-section"><div class="p05-section-number">01</div><h2 class="p05-section-title">从屋面来到入口</h2><figure class="p05-figure"><div class="p05-section-image-wrap vertical"><img class="p05-section-image" loading="lazy" src="../assets/images/SB_001/02.jpg" alt="竹堂入口"></div><figcaption class="p05-image-title">竹堂入口</figcaption></figure><p class="p05-section-text">从较高处望去，竹堂与周围屋舍彼此相连；走近门前，建筑又回到人的步行尺度。一远一近之间，一座有独立名称的老建筑始终处在村落整体之中。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
