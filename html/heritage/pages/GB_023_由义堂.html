到侧旁，山墙、巷道和相邻屋舍同时出现。空间在转角处渐渐收窄，让人感受到新叶村紧凑而连续的街巷尺度。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
