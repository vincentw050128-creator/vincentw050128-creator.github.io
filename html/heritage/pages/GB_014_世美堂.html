<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>世美堂 · 新叶村数字导览</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../../../assets/styles/heritage.css"><link rel="stylesheet" href="../../../assets/styles/presentation.css"><script src="../../../js/chrome.js" defer></script><script src="../../../js/navigation.js" defer></script><script src="../../../js/heritage.js" defer></script></head><body class="heritage-page"><main class="stage"><section class="device"><div class="screen p05-page"><div class="p05-scroll-content"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="capsule">▮▮ <span class="battery"></span></span></div><div class="wechat-capsule" aria-hidden="true"><span class="dot-menu"></span><span class="circle-dot"></span></div><section class="p05-hero"><img class="p05-hero-img" src="../assets/images/GB_014/01.jpg" alt="世美堂主视觉"><div class="p05-top-actions"><a class="p05-back-btn" href="../index.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div></section><article class="p05-content-panel p05-page--textlean"><div class="p05-badges"><span class="p05-badge p05-badge--protect">国保</span><span class="p05-badge p05-badge--type">传统民居</span></div><span class="p05-tagline">屋瓦相连，巷路悠长</span><h1 class="p05-spot-name">世美堂</h1><p class="p05-summary">世美堂是全国重点文物保护单位“新叶村乡土建筑”的传统民居之一。从空中望去，它与周围老宅共同嵌在古村密集的屋面之间，成为新叶传统居住空间的一部分。</p><div class="p05-details"><section class="p05-section"><div class="p05-section-number">01</div><h2 class="p05-section-title">一条通往南塘的街巷</h2><p class="p05-section-text">世美堂南侧有一段大致呈东西走向的街巷，沿它一路向西便可通往南塘。在新叶村密集相连的民居之间，这样的街巷把一户户人家与村中最大的水塘连在一起；从世美堂出发的这条巷道，正是村民走向南塘水边的日常通路之一。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
