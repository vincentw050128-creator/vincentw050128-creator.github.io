<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>叶昭生、叶文芝民居 · 新叶村数字导览</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../../../assets/styles/heritage.css"><link rel="stylesheet" href="../../../assets/styles/presentation.css"><script src="../../../js/chrome.js" defer></script><script src="../../../js/navigation.js" defer></script><script src="../../../js/heritage.js" defer></script></head><body class="heritage-page"><main class="stage"><section class="device"><div class="screen p05-page"><div class="p05-scroll-content"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="capsule">▮▮ <span class="battery"></span></span></div><div class="wechat-capsule" aria-hidden="true"><span class="dot-menu"></span><span class="circle-dot"></span></div><section class="p05-hero"><img class="p05-hero-img" src="../assets/images/SB_023/01.jpg" alt="叶昭生、叶文芝民居主视觉"><div class="p05-top-actions"><a class="p05-back-btn" href="../index.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div></section><article class="p05-content-panel"><div class="p05-badges"><span class="p05-badge p05-badge--protect">省保</span><span class="p05-badge p05-badge--type">传统民居</span></div><span class="p05-tagline">从周边走向一处入口</span><h1 class="p05-spot-name">叶昭生、叶文芝民居</h1><p class="p05-summary">叶昭生、叶文芝民居是省级文物保护单位“新叶村乡土建筑”的组成部分。周边环境、正面入口与侧廊相互连接，形成由外向内的行走层次。</p><div class="p05-details"><section class="p05-section"><div class="p05-section-number">01</div><h2 class="p05-section-title">先看住宅与周边</h2><figure class="p05-figure"><div class="p05-section-image-wrap wide"><img class="p05-section-image" loading="lazy" src="../assets/images/SB_023/02.jpg" alt="周边环境"></div><figcaption class="p05-image-title">周边环境</figcaption></figure><p class="p05-section-text">从稍远处接近，住宅与邻近屋舍、通行空间一同出现。建筑顺着聚落肌理安置，也与周围老宅保持着紧密联系。</p></section><section class="p05-section"><div class="p05-section-number">02</div><h2 class="p05-section-title">再回到正面入口</h2><figure class="p05-figure"><div class="p05-section-image-wrap wide"><img class="p05-section-image" loading="lazy" src="../assets/images/SB_023/03.jpg" alt="正立面入口"></div><figcaption class="p05-image-title">正立面入口</figcaption></figure><p class="p05-section-text">走到正面，注意力收拢到入口。由这里转入侧廊，外部巷道的开敞逐渐变为宅内较为幽静的空间。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
