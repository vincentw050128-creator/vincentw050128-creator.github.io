<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>叶柏林民居 · 新叶村数字导览</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../../../assets/styles/heritage.css"><link rel="stylesheet" href="../../../assets/styles/presentation.css"><script src="../../../js/chrome.js" defer></script><script src="../../../js/navigation.js" defer></script><script src="../../../js/heritage.js" defer></script></head><body class="heritage-page"><main class="stage"><section class="device"><div class="screen p05-page"><div class="p05-scroll-content"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="capsule">▮▮ <span class="battery"></span></span></div><div class="wechat-capsule" aria-hidden="true"><span class="dot-menu"></span><span class="circle-dot"></span></div><section class="p05-hero"><img class="p05-hero-img" src="../assets/images/SB_011/01.jpg" alt="叶柏林民居主视觉"><div class="p05-top-actions"><a class="p05-back-btn" href="../index.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div></section><article class="p05-content-panel"><div class="p05-badges"><span class="p05-badge p05-badge--protect">省保</span><span class="p05-badge p05-badge--type">传统民居</span></div><span class="p05-tagline">由院落进入建筑层次</span><h1 class="p05-spot-name">叶柏林民居</h1><p class="p05-summary">叶柏林民居是省级文物保护单位“新叶村乡土建筑”的组成部分。由院落走近立面，空间从围合关系逐渐转向墙面、屋檐与光影细节。</p><div class="p05-details"><section class="p05-section"><div class="p05-section-number">01</div><h2 class="p05-section-title">院落中的空间转折</h2><figure class="p05-figure"><div class="p05-section-image-wrap wide"><img class="p05-section-image" loading="lazy" src="../assets/images/SB_011/02.jpg" alt="院落景观"></div><figcaption class="p05-image-title">院落景观</figcaption></figure><p class="p05-section-text">从街巷进入院落，空间由外部通行转为较为安静的内部尺度。墙面围合着一方停驻之处，也让行走节奏随之放缓。</p></section><section class="p05-section"><div class="p05-section-number">02</div><h2 class="p05-section-title">近观建筑立面</h2><figure class="p05-figure"><div class="p05-section-image-wrap wide"><img class="p05-section-image" loading="lazy" src="../assets/images/SB_011/03.jpg" alt="立面细节"></div><figcaption class="p05-image-title">立面细节</figcaption></figure><p class="p05-section-text">靠近立面时，视线由院落转向墙面和屋檐形成的轮廓。明暗、材质与尺度在近处更加清楚，补充了院落整体带来的空间感受。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
