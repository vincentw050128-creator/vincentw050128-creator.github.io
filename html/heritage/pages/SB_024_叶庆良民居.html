<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>叶庆良民居 · 新叶村数字导览</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../../../assets/styles/heritage.css"><link rel="stylesheet" href="../../../assets/styles/presentation.css"><script src="../../../js/chrome.js" defer></script><script src="../../../js/navigation.js" defer></script><script src="../../../js/heritage.js" defer></script></head><body class="heritage-page"><main class="stage"><section class="device"><div class="screen p05-page"><div class="p05-scroll-content p05-noimg"><div class="statusbar statusbar--dark" aria-hidden="true"><span>9:41</span><span class="capsule">▮▮ <span class="battery"></span></span></div><header class="p05-textcover"><div class="p05-back-row"><a class="p05-back-btn" href="../index.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div><div class="p05-badges"><span class="p05-badge p05-badge--protect">省保</span><span class="p05-badge p05-badge--type">传统民居</span></div><span class="p05-tagline">乡土建筑群中的一处民居</span><h1 class="p05-spot-name">叶庆良民居</h1></header><article class="p05-content-panel p05-content-panel--flat"><p class="p05-summary">叶庆良民居是省级文物保护单位“新叶村乡土建筑”的组成部分。它与村中的祠堂、桥梁、街巷和其他民居共同构成乡土建筑群。</p><div class="p05-details"><section class="p05-section"><div class="p05-section-number">01</div><h2 class="p05-section-title">与祠堂、桥梁和民居共同留存</h2><p class="p05-section-text">新叶村保存的不只是单座住宅，还包括祠堂、塔、桥梁、街巷和水系。叶庆良民居属于其中的居住建筑部分，其价值需要放在完整乡土建筑群中理解。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
