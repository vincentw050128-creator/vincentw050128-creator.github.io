<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>存心堂 · 新叶村数字导览</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../../../assets/styles/heritage.css"><link rel="stylesheet" href="../../../assets/styles/presentation.css"><script src="../../../js/chrome.js" defer></script><script src="../../../js/navigation.js" defer></script><script src="../../../js/heritage.js" defer></script></head><body class="heritage-page"><main class="stage"><section class="device"><div class="screen p05-page"><div class="p05-scroll-content"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="capsule">▮▮ <span class="battery"></span></span></div><div class="wechat-capsule" aria-hidden="true"><span class="dot-menu"></span><span class="circle-dot"></span></div><section class="p05-hero"><img class="p05-hero-img" src="../assets/images/GB_010/01.jpg" alt="存心堂主视觉"><div class="p05-top-actions"><a class="p05-back-btn" href="../index.html" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div></section><article class="p05-content-panel"><div class="p05-badges"><span class="p05-badge p05-badge--protect">国保</span><span class="p05-badge p05-badge--type">宗祠建筑</span></div><span class="p05-tagline">临塘深院，旧府遗风</span><h1 class="p05-spot-name">存心堂</h1><p class="p05-summary">存心堂又称“骏马府”，是新叶村叶氏的一座祠堂。建筑临塘而立，水面与白墙灰瓦共同形成开阔的入口环境。</p><div class="p05-details"><section class="p05-section"><div class="p05-section-number">01</div><h2 class="p05-section-title">明代嘉靖年间的老祠堂</h2><p class="p05-section-text">存心堂建于明嘉靖二十五年（1546年），采用三开间对合式布局。相向布置的建筑围合出内部空间，在有限尺度中形成端正而紧凑的平面关系。</p></section><section class="p05-section"><div class="p05-section-number">02</div><h2 class="p05-section-title">列柱厅堂与天井</h2><figure class="p05-figure"><div class="p05-section-image-wrap wide"><img class="p05-section-image" loading="lazy" src="../assets/images/GB_010/02.jpg" alt="厅堂列柱与天井石阶"></div><figcaption class="p05-image-title">厅堂列柱与天井石阶</figcaption></figure><p class="p05-section-text">走进存心堂，粗大的木柱撑起高敞厅堂，中间是石材铺就的天井，几级石阶连接前后空间。木柱、天井与高差共同组织出由明亮院落转入室内的空间层次。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
