周围连片屋面；走近入口，尺度随之收拢到门前和巷道。一远一近，呈现出老宅与古村的紧密联系。</p></section></div><a class="p05-continue" href="../index.html">发现更多古村节点</a></article></div><div class="home-indicator" aria-hidden="true"></div></div></section></main></body></html>
