<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>新叶村数字导览 · 可缩放景区地图</title>
  <style>
    :root{--accent:#a22e25;--ink:#1c1b19;--muted:#68645e;--paper:#fbfaf7;--line:#e9e5de;--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;--serif:"Songti SC","STSong","SimSun",serif}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:var(--sans);color:var(--ink)}
    body{display:grid;place-items:center;padding:32px;background:radial-gradient(ellipse at 50% 22%,#fff 0,#f5f2ee 68%,#ede8e1 100%)}
    button,a,input{font:inherit}.stage{display:flex;flex-direction:column;align-items:center;gap:16px}.caption{font-size:12px;letter-spacing:.08em;color:#777}.caption strong{color:#333}
    .device{position:relative;width:390px;height:844px;padding:12px;border-radius:56px;background:linear-gradient(160deg,#29292b,#111 56%,#050505);box-shadow:inset 0 0 0 2px #000,0 28px 60px -12px #0007,0 8px 20px -8px #0006}
    .device:before,.device:after{content:"";position:absolute;top:100px;bottom:100px;width:3px;background:linear-gradient(transparent,#ffffff18 12%,transparent 22%,transparent 78%,#ffffff12 90%,transparent)}.device:before{left:-1px}.device:after{right:-1px}
    .rail{position:absolute;width:4px;border-radius:3px;background:#09090b}.r1{left:-3px;top:174px;height:32px}.r2{left:-3px;top:220px;height:60px}.r3{left:-3px;top:290px;height:60px}.r4{right:-3px;top:250px;height:100px}
    .island{position:absolute;z-index:50;top:22px;left:50%;translate:-50%;width:124px;height:36px;border-radius:99px;background:#000}
    .screen{position:relative;width:100%;height:100%;overflow:hidden;border-radius:44px;background:var(--paper)}
    .status{position:absolute;z-index:40;top:0;left:0;right:0;height:48px;padding:18px 26px 0;display:flex;justify-content:space-between;align-items:flex-start;font-weight:650;font-size:15px}.status-right{display:flex;align-items:center;gap:6px}.status svg{width:17px;height:11px;fill:#111}.status .battery{width:25px}
    .map{position:absolute;inset:132px 0 77px;overflow:hidden;touch-action:none;background:#afc776;cursor:grab}.map.dragging{cursor:grabbing}
    .map-canvas{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:50% 50%;will-change:transform}
    .map-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none;pointer-events:none}
    .tower-hotspot{position:absolute;left:61.7%;top:64%;translate:-50% -50%;min-width:51px;height:25px;padding:0 8px;border:0;border-radius:13px;background:#8f342d;color:#fff;font-size:10px;font-weight:650;box-shadow:0 2px 7px #0003;cursor:pointer;white-space:nowrap}.tower-hotspot:after{content:"";position:absolute;inset:-9px;border-radius:20px;border:2px solid #fff9;animation:pulse 1.8s infinite}.tower-hotspot.selected{background:var(--accent)}@keyframes pulse{0%,100%{scale:.9;opacity:.2}50%{scale:1.12;opacity:.8}}
    .zoom{position:absolute;z-index:25;left:14px;top:350px;width:34px;border-radius:18px;overflow:hidden;background:#fffffff3;box-shadow:0 8px 20px #4c453526}.zoom button{display:block;width:34px;height:34px;border:0;background:transparent;font-size:20px;line-height:1;cursor:pointer}.zoom button+button{border-top:1px solid #e8e4dc}.zoom button:active{background:#f0ece5}
    .search{position:absolute;z-index:20;top:51px;left:20px;right:20px;height:36px;border-radius:22px;background:#fffffff2;box-shadow:0 4px 18px #6a604a18;display:flex;align-items:center;gap:10px;padding:0 14px;color:#999}.search svg{width:18px;fill:none;stroke:#111;stroke-width:1.8}.search input{width:100%;border:0;outline:0;background:transparent;color:#333;font-size:14px}.search input::placeholder{color:#999}
    .filters{position:absolute;z-index:20;top:96px;left:20px;right:20px;height:36px;border-radius:22px;background:#fffffff1;box-shadow:0 4px 18px #6a604a18;display:grid;grid-template-columns:repeat(4,1fr);padding:3px}.filter{border:0;background:transparent;border-radius:18px;color:#222;font-size:13px;cursor:pointer}.filter.active{color:var(--accent);background:#fff;box-shadow:0 3px 10px #4b40351a;font-weight:600}.filter:focus-visible,.tool:focus-visible,.tab:focus-visible,.detail:focus-visible{outline:2px solid #216fdb;outline-offset:2px}
    .tools{position:absolute;z-index:24;top:350px;right:12px;width:48px;padding:8px 0;border-radius:26px;background:#fffffff3;box-shadow:0 10px 24px #4c45352a;display:grid}.tool{height:54px;border:0;background:none;display:grid;place-items:center;align-content:center;gap:2px;font-size:11px;cursor:pointer}.tool svg{width:21px;height:21px;fill:none;stroke:#111;stroke-width:1.7}.tool.on{color:var(--accent)}
    .sheet{position:absolute;z-index:30;left:0;right:0;top:520px;bottom:77px;border-radius:24px 24px 0 0;background:#fff;box-shadow:0 -10px 30px #4d46331c;padding:27px 20px 12px;opacity:0;translate:0 105%;pointer-events:none;transition:translate .32s cubic-bezier(.2,.8,.2,1),opacity .2s}.sheet.open{opacity:1;translate:0;pointer-events:auto}.grab{position:absolute;top:9px;left:50%;translate:-50%;width:28px;height:3px;border-radius:9px;background:#aaa}.close-card{position:absolute;right:14px;top:11px;width:27px;height:27px;border:0;border-radius:50%;background:#f3f0eb;color:#555;cursor:pointer}.tag{display:inline-block;padding:4px 9px;border-radius:13px;background:#edf5f3;color:#28655e;font-size:10px}.sheet h1{margin:7px 0 8px;font:500 24px/1.1 var(--serif);letter-spacing:.03em}.meta{display:grid;gap:5px;color:#5f5b55;font-size:11px}.meta div{display:flex;align-items:center;gap:6px}.meta svg{width:14px;height:14px;fill:none;stroke:#777;stroke-width:1.7}.desc{width:65%;margin:8px 0 0;font-size:10px;line-height:1.55;color:#3f3c38}.tower{position:absolute;right:22px;top:39px;width:100px;height:155px;object-fit:cover;object-position:68% 51%;mix-blend-mode:multiply;filter:contrast(1.03)}
    .detail{position:absolute;left:20px;right:20px;bottom:9px;height:33px;border:0;border-radius:20px;background:linear-gradient(90deg,#faf9f6,#f7f4ef);color:var(--accent);font-weight:600;font-size:12px;cursor:pointer}.detail span{margin-left:8px;font-size:17px}
    .list-button{position:absolute;z-index:22;left:50%;bottom:93px;translate:-50%;height:36px;padding:0 24px;border:0;border-radius:20px;background:#fffffff0;box-shadow:0 7px 18px #4c45351f;color:#37332e;font-size:12px;white-space:nowrap;cursor:pointer;transition:opacity .2s}.screen.card-open .list-button{opacity:0;pointer-events:none}
    .tabbar{position:absolute;z-index:35;left:0;right:0;bottom:20px;height:57px;display:grid;grid-template-columns:repeat(5,1fr);border-top:.5px solid var(--line);background:#fffffffa;padding-top:5px}.tab{border:0;background:none;color:#4f4b46;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;cursor:pointer}.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.5}.tab.active{color:var(--accent)}.tab.active svg{stroke-width:1.9}.home{position:absolute;z-index:36;bottom:7px;left:50%;translate:-50%;width:134px;height:5px;border-radius:9px;background:#151515}
    .toast{position:absolute;z-index:80;left:50%;bottom:96px;translate:-50% 10px;padding:7px 12px;border-radius:16px;background:#161616dc;color:#fff;font-size:11px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;translate:-50% 0}
    @media(max-width:480px){body{padding:0;background:#111}.stage{gap:0}.caption{display:none}.device{width:100vw;height:100dvh;border-radius:0;padding:0}.screen{border-radius:0}.island{top:10px}.rail{display:none}}
  </style>
<link rel="stylesheet" href="../assets/styles/presentation.css">
<script src="../js/chrome.js" defer></script>
<script src="../js/navigation.js" defer></script>
<link rel="stylesheet" href="../assets/styles/map-interactions.css">
</head>
<body data-unified-tabs>
  <div class="stage">
    <div class="caption"><strong>新叶村数字导览</strong> · 景区地图</div>
    <div class="device">
      <i class="rail r1"></i><i class="rail r2"></i><i class="rail r3"></i><i class="rail r4"></i><i class="island"></i>
      <div class="screen">
        <div class="status"><span>9:41</span><span class="status-right">
          <svg viewBox="0 0 17 11"><rect y="7" width="3" height="4" rx=".6"/><rect x="4" y="5" width="3" height="6" rx=".6"/><rect x="8" y="3" width="3" height="8" rx=".6"/><rect x="12" width="3" height="11" rx=".6"/></svg>
          <svg viewBox="0 0 17 11"><path d="M8.5 1.5c-3 0-5.8 1.1-8 3.1L2 6.1c1.8-1.6 4.1-2.5 6.5-2.5s4.7.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6 5 9.1c1-.9 2.2-1.4 3.5-1.4S11 8.2 12 9.1l1.5-1.5c-1.4-1.3-3.1-2-5-2s-3.6.7-5 2zM6.5 10.6l2 2 2-2c-.5-.5-1.2-.8-2-.8s-1.5.3-2 .8z"/></svg>
          <svg class="battery" viewBox="0 0 25 11"><rect x=".5" y=".5" width="21" height="10" rx="2.5" fill="none" stroke="#111" stroke-opacity=".45"/><rect x="22" y="3.5" width="1.5" height="4" rx=".4"/><rect x="2" y="2" width="18" height="7" rx="1.4"/></svg>
        </span></div>
        <div class="map" aria-label="可缩放的新叶村景区手绘地图">
          <div class="map-canvas">
            <img class="map-image" src="../assets/images/map/景区手绘地图.PNG" alt="新叶村景区手绘地图" draggable="false">
          </div>
        </div>
        <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input aria-label="搜索" placeholder="搜索古建、路线与故事"></label>
        <div class="filters"><button class="filter active">▥&nbsp; 古建筑</button><button class="filter">≋&nbsp; 水系</button><button class="filter">◇&nbsp; 非遗</button><button class="filter">♙&nbsp; 服务</button></div>
        <div class="tools">
          <button class="tool" data-msg="正在定位"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>定位</button>
          <button class="tool" data-msg="图层已切换"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></svg>图层</button>
          <button class="tool" data-msg="路线模式已开启"><svg viewBox="0 0 24 24"><path d="M4 18c4-8 7 1 11-7 1.5-3 3-3 5-3"/><circle cx="4" cy="18" r="2"/><path d="m17 5 3 3-3 3"/></svg>路线</button>
        </div>
        <div class="zoom" aria-label="地图缩放"><button class="zoom-in" aria-label="放大地图">＋</button><button class="zoom-out" aria-label="缩小地图">−</button></div>
        <button class="list-button" data-nav="heritage">☷　查看文保点列表</button>
        <section class="sheet">
          <i class="grab"></i><button class="close-card" aria-label="关闭详情卡">×</button><div class="card-body"><span class="tag">玉华山前，一塔寄文心</span><h1>抟云塔</h1>
          <div class="meta"><div><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="2.5"/></svg>新叶村村口，文昌阁旁</div><div><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6h4"/></svg>历史建筑 · 明隆庆五年（1567）</div></div>
          <p class="desc">抟云塔始建于明隆庆五年（1567），与文昌阁相邻而立。塔名取意于大鹏扶摇而上的意象，寄托着新叶村崇尚读书、耕读传家的文化愿望。</p>
          <img class="tower" src="../assets/images/map/抟云塔卡片配图.png" alt="抟云塔">
          </div><button class="detail" data-nav="tower">查看详情 <span>›</span></button>
        </section>
        <nav class="tabbar" aria-label="主导航">
          <button class="tab" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11H3z"/></svg>首页</button>
          <button class="tab active" data-nav="map"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>导览</button>
          <button class="tab" data-pending="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>探索</button>
          <button class="tab" data-nav="checkinXishan"><svg viewBox="0 0 24 24"><circle cx="8.5" cy="7" r="4"/><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><path d="m17 11 2 2 4-4"/></svg>任务</button>
          <button class="tab" data-nav="mine"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/></svg>我的</button>
        </nav>
        <i class="home"></i><div class="toast" role="status"></div>
      </div>
    </div>
  </div>
  <script>
    const toast=document.querySelector('.toast');let timer;
    function say(text){toast.textContent=text;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1200)}
    document.querySelectorAll('[data-msg]').forEach(el=>el.addEventListener('click',()=>{el.classList.toggle('on');say(el.dataset.msg)}));
    document.querySelectorAll('.filter').forEach(el=>el.addEventListener('click',()=>{document.querySelector('.filter.active')?.classList.remove('active');el.classList.add('active');say(`已切换到${el.textContent.trim()}`)}));
    document.querySelectorAll('.tab').forEach(el=>el.addEventListener('click',()=>{document.querySelector('.tab.active')?.classList.remove('active');el.classList.add('active');say(el.textContent.trim())}));
</script>
<script src="../js/heritage-data.js"></script>
<script src="../js/map-points.js"></script>
<script src="../js/map-viewer.js"></script>
</body>
</html>
